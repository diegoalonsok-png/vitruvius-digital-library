name: Palladio 1570 — folios completos y miniaturas a R2
on:
  push:
    paths:
      - '.github/workflows/palladio-1570-folios-r2.yml'
      - 'scripts/r2-palladio-1570-pdf-folios.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: palladio-1570-folios-r2
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet "boto3>=1.36" pymupdf
      - name: Descargar y convertir ejemplar Palladio de 1570, crear miniaturas y transferir a R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/r2-palladio-1570-pdf-folios.py
      - name: Confirmar índice y publicar metadatos ligeros
        run: |
          python - <<'PY'
          import json
          j=json.load(open('data/r2/folios/palladio-quattro-libri.json'))
          assert len(j['folios']) == j['imagenes'] > 300
          assert all(x['imagenDigital']==i and x['miniatura'] and x['imagen'] and x['sha256'] for i,x in enumerate(j['folios'],1))
          print('Secuencia R2 Palladio:',j['imagenes'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/r2/folios/palladio-quattro-libri.json
          git diff --cached --quiet && exit 1
          git commit -m "Palladio 1570: folios y miniaturas verificados en R2"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
