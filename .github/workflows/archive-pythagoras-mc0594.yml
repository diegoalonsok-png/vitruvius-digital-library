name: Archive verified Pythagoras sculpture photo
on:
  push:
    paths:
      - 'scripts/archive-pythagoras-mc0594.py'
      - '.github/workflows/archive-pythagoras-mc0594.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/archive-pythagoras-mc0594.py
      - name: Commit CC BY-SA credited photograph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/personajes/pythagoras-musei-capitolini-mc0594.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Archive credited Capitoline bust of Pythagoras MC0594"
            git push
          fi
