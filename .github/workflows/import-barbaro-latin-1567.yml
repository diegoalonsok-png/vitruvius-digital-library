name: Import Barbaro 1567 Latin IIIF edition to GitHub
on:
  push:
    paths:
      - 'scripts/import-barbaro-latin-1567.py'
      - '.github/workflows/import-barbaro-latin-1567.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify complete Latin IIIF edition
        run: python scripts/import-barbaro-latin-1567.py
      - name: Publish manifest and image files in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/iiif/barbaro-latin-1567.json images/barbaro-latin-1567/
          if ! git diff --cached --quiet; then
            git commit -m "Archive Barbaro Latin edition 1567 with local IIIF facsimile files"
            git push
          fi
