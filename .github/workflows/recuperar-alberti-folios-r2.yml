name: Bibliotheca R2 — recuperar folios completos de Alberti 1582
on:
  push:
    paths:
      - ".github/workflows/recuperar-alberti-folios-r2.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recuperar-alberti-r2
  cancel-in-progress: false
jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "boto3>=1.36"
      - name: Descargar 402 imágenes de la edición sevillana y subir cada una a Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/r2-folios-obra.py --obra alberti-diez-libros-1582 --desde 1 --hasta 0 --ancho 1600 --miniatura 220
      - name: Guardar catálogo de imágenes verificado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/r2/folios/alberti-diez-libros-1582.json
          if git diff --cached --quiet; then exit 1; fi
          git commit -m "Alberti 1582: folios comprobados en R2 y catálogo actualizado"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
