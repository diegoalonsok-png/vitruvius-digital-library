name: Seguridad · auditoría no destructiva

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "21 10 * * 1"
  workflow_dispatch:

# No workflow token write permissions; this job never publishes content.
permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-security-audit:
    name: Security baseline (read only)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout without persisted authentication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run non-destructive security checks
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check scripts/security-audit.mjs
          node scripts/security-audit.mjs
