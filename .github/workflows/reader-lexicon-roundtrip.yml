name: Reader Lexicon interoperability
on:
  push:
    paths:
      - 'assets/classics-study-actions.js'
      - 'assets/classics-lexical-popup.js'
      - 'scripts/test-classics-lexical-context.mjs'
      - 'classics-text-reader.html'
      - 'assets/vitruvia-lexicon.js'
      - 'assets/lexicon-ngram-engine.js'
      - 'scripts/test-lexicon-ngrams.mjs'
      - 'scripts/test-classics-study-actions.mjs'
      - 'scripts/test-lexicon-continuation.mjs'
      - 'scripts/test-lexicon-source-language.mjs'
      - 'scripts/test-lexicon-passage-issues.mjs'
      - 'scripts/test-notebook-bibliotheca-itinerary.mjs'
      - 'assets/bibliotheca-simple.js'
      - 'vitruvia-lexicon.html'
      - 'bibliotheca-graeca-latina.html'
      - '.github/workflows/reader-lexicon-roundtrip.yml'
  pull_request:
    paths:
      - 'assets/classics-study-actions.js'
      - 'assets/classics-lexical-popup.js'
      - 'scripts/test-classics-lexical-context.mjs'
      - 'classics-text-reader.html'
      - 'assets/vitruvia-lexicon.js'
      - 'assets/lexicon-ngram-engine.js'
      - 'scripts/test-lexicon-ngrams.mjs'
      - 'scripts/test-classics-study-actions.mjs'
      - 'scripts/test-lexicon-continuation.mjs'
      - 'scripts/test-lexicon-source-language.mjs'
      - 'scripts/test-lexicon-passage-issues.mjs'
      - 'scripts/test-notebook-bibliotheca-itinerary.mjs'
      - 'assets/bibliotheca-simple.js'
      - 'vitruvia-lexicon.html'
      - 'bibliotheca-graeca-latina.html'
      - '.github/workflows/reader-lexicon-roundtrip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-classics-study-actions.mjs
      - run: node scripts/test-lexicon-continuation.mjs
      - run: node scripts/test-lexicon-source-language.mjs
      - run: node scripts/test-lexicon-passage-issues.mjs
      - run: node scripts/test-notebook-bibliotheca-itinerary.mjs
      - run: node scripts/test-classics-lexical-context.mjs
      - run: node scripts/test-lexicon-ngrams.mjs
