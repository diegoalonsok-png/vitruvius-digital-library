name: R2 — biblioteca clásica, tanda diaria

# Cuatro tandas cada seis horas, de hasta 15 candidatos verificables cada una.
# Evitar una ejecución ilimitada bloqueada por OCR o descargas de fuentes inaccesibles.
# Todos los días: incorpora obras clásicas de dominio público que la biblioteca
# todavía no tiene, les da ficha de repertorio, las indexa y recalcula los
# contadores. Los PDF, su texto y los fragmentos del índice van SOLO a Cloudflare
# R2; al repositorio entran únicamente los catálogos, las fichas y los
# manifiestos, que son livianos. No borra nada y no repite una obra que ya está
# en la biblioteca: sólo admite otra edición si el candidato la justifica.

on:
  # Los cambios de candidatos y de este flujo inician una tanda verificada.
  # Los commits publicados con GITHUB_TOKEN no recursan en nuevos workflows.
  push:
    branches: [main]
    paths:
      - 'data/r2/clasicos-candidatos.json'
      - 'assets/bibliotheca-corpus-search.js'
      - 'scripts/test-classics-source-diagnostics.mjs'
      - 'scripts/test-classics-academic-reader.mjs'
      - '.github/workflows/r2-biblioteca-diaria.yml'
  schedule:
    - cron: "43 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      limite:
        description: "Máximo de obras en la tanda (0 = todas las pendientes)"
        default: "15"
      traducciones:
        description: "Buscar traducciones de dominio público para las obras alojadas sin ninguna"
        type: boolean
        default: true

concurrency:
  group: vdl-classics-publication-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tanda:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar base de trabajo desde main
        run: |
          git fetch --quiet origin main
          git checkout -B vdl-publication origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "boto3>=1.36" pymupdf

      # Reindexar frente al registro actual antes de exigir índice estático.
      # Nuevas ediciones indexadas por otro workflow pueden haber avanzado el
      # registro sin disparar este workflow (commits del token GITHUB_TOKEN).
      - name: Reconciliar índice semántico local con el registro vigente
        run: |
          python scripts/build_classics_semantic_index.py
          python scripts/check_classics_semantic_index_coverage.py

      # La tanda siguiente se bloquea si el lector, la búsqueda semántica o
      # la integración de traducción fallan en las pruebas reproducibles.
      # La prueba de traducción usa un proveedor simulado; no certifica
      # la disponibilidad del servicio externo en producción.
      - name: Verificar búsqueda semántica, lectores y traducción antes de descargar más
        run: |
          npm install --no-save jsdom
          node scripts/test-classics-source-diagnostics.mjs
          node scripts/test-classics-reader-search.mjs
          node scripts/test-classics-academic-reader.mjs
          node scripts/test-early-witness-reading.mjs
          node scripts/test-r2-busqueda-clasicos.mjs

      - name: Auditoría inicial de fichas, textos y raíces indexadas
        run: node scripts/audit-bibliotheca-federada.mjs --check --strict

      - name: Estado de la biblioteca antes de la tanda
        run: python scripts/r2-duplicados.py

      - name: Buscar traducciones humanas históricas para originales alojados en R2
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.traducciones }}
        run: python scripts/r2-candidatos-traducciones.py --limite 12 --idiomas en,fr,es

      - name: OCR de páginas escaneadas (griego, latín y traducciones)
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-grc tesseract-ocr-lat tesseract-ocr-eng tesseract-ocr-fra tesseract-ocr-spa
      - name: Incorporar obras nuevas a R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          LIMITE: ${{ inputs.limite || '15' }}
        run: python scripts/r2-importar-clasicos.py

      # Un original recién subido puede no haber existido al descubrir
      # traducciones antes de la tanda. Rebuscar EN -> FR -> ES ahora, con
      # metadatos de edición y derechos; ningún archivo completo va a GitHub.
      - name: Buscar traducciones humanas para los originales recién incorporados
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.traducciones }}
        run: |
          cp r2-clasicos-informe.json r2-clasicos-informe-originales.json
          cp data/r2/clasicos-candidatos.json /tmp/clasicos-candidatos-antes-traducciones.json
          python scripts/r2-candidatos-traducciones.py --nuevas --limite 12 --idiomas en,fr,es
          if cmp -s /tmp/clasicos-candidatos-antes-traducciones.json data/r2/clasicos-candidatos.json; then
            echo 'No se encontraron traducciones candidatas nuevas para esta tanda.'
          else
            echo 'Se encontraron traducciones candidatas: importar únicamente si pasan los controles de fuente, idioma y derechos.'
            SOLO_TRADUCCIONES=1 LIMITE=4 python scripts/r2-importar-clasicos.py
          fi

      - name: Ficha de repertorio para las obras nuevas
        # No publicar contadores, fichas ni índices si falló un paso anterior.
        run: python scripts/r2-fichas-obras-nuevas.py

      - name: Generar aparato académico y control de evidencia de cada edición R2
        # No publicar contadores, fichas ni índices si falló un paso anterior.
        run: python scripts/r2-aparato-academico.py

      - name: Vincular facsímiles con el repertorio
        # No publicar contadores, fichas ni índices si falló un paso anterior.
        run: python scripts/r2-vincular-repertorio.py

      - name: Sincronizar inventario académico GitHub y R2
        # No publicar contadores, fichas ni índices si falló un paso anterior.
        run: python scripts/sync-bibliotheca-github-r2.py

      - name: Completar los campos derivados de las fichas
        # No publicar contadores, fichas ni índices si falló un paso anterior.
        run: node scripts/enrich-classical-records.mjs

      - name: Rehacer los datos derivados del repertorio
        # No publicar contadores, fichas ni índices si falló un paso anterior.
        run: |
          python scripts/build_ecdotics_222.py --write
          python scripts/build_codicological_trees_222.py --write
          python scripts/sync-classics-coverage.py
          python scripts/audit-classics-222-roadmap.py
          python scripts/sincronizar-reconciliacion.py
          python scripts/cifras-corpus.py
          python scripts/sync-classics-coverage.py

      - name: Actualizar el índice de autores y obras desde las fichas ya acreditadas
        run: node scripts/refresh-index-auctorum.mjs

      - name: Indexar las obras de la tanda y subir el índice a R2
        # No publicar contadores, fichas ni índices si falló un paso anterior.
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          NUEVAS=$(python scripts/r2-ids-tanda.py)
          if [ -z "$NUEVAS" ]; then echo "Sin obras nuevas: el índice queda como está."; exit 0; fi
          echo "Indexando: $NUEVAS"
          node scripts/r2-indexar-clasicos.mjs --salida /tmp/indice-r2 --obras "$NUEVAS"
          python scripts/r2-subir-indice.py --origen /tmp/indice-r2/indice

      - name: Reconstruir panel federado y auditar objetos reales de R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          node scripts/audit-bibliotheca-federada.mjs --strict
          python scripts/audit-bibliotheca-r2-live.py --required

      - name: Comprobar el visor, la búsqueda y la fusión del índice
        run: |
          npm install --no-save jsdom
          node scripts/test-classics-source-diagnostics.mjs
          node scripts/test-classics-reader-search.mjs
          node scripts/test-classics-academic-reader.mjs
          node scripts/test-early-witness-reading.mjs
          node scripts/test-visor-facsimiles-r2.mjs
          node scripts/test-r2-busqueda-clasicos.mjs
          node scripts/test-r2-indice-fusion.mjs
          node scripts/test-r2-indice-clasicos.mjs
          node scripts/test-classics-integration.mjs
          node scripts/test-bibliotheca-dual-reader.mjs
          node scripts/test-cifra-obras.mjs
          node scripts/test-export-xlsx-datos.mjs

      - name: Auditar títulos, índices, pasajes y sincronización documental
        run: |
          node scripts/audit-bibliotheca-indexation.mjs --strict
          python scripts/sync-bibliotheca-github-r2.py
          node scripts/audit-bibliotheca-federada.mjs --strict
          python scripts/cifras-corpus.py

      - name: Verificar objetos físicos de R2 y manifiesto de indexación
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: vitruvius-bibliotheca
        run: |
          python scripts/audit-r2-object-presence.py
          python scripts/audit-bibliotheca-r2-live.py --required

      - name: Guardar catálogos, fichas y manifiestos (solo archivos livianos)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Nunca poner textos completos ni fragmentos de índice de Bibliotheca en GitHub.
          git add -- data/r2 data/cifras-corpus.json data/bibliotheca-graeca-latina-I-bce-I-ce.json \
            data/classics-corpus/search-registry.json data/classics-corpus/coverage-audit.json \
            data/perseus-provenance-audit.json reports index-auctorum-operum.html
          # Aun si algún generador antiguo modificó un texto, no lo versionar aquí.
          if git diff --cached --name-only | grep -E '^data/classics-corpus/[a-z0-9-]+-(grc|la|en|fr|es|it|de|pt)\.json$|^data/index/classics/'; then
            echo '::error::La tanda intenta incluir libros o índices voluminosos en GitHub.'
            exit 1
          fi
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Biblioteca clásica: tanda diaria incorporada, indexada y contada"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then exit 0; fi
            if test -d .git/rebase-merge || test -d .git/rebase-apply; then git rebase --abort; exit 1; fi
            sleep 8
          done
          echo "::error::No se pudo publicar el inventario; R2 puede tener una tanda pendiente de sincronizar."
          exit 1

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-tanda-diaria
          path: |
            r2-clasicos-informe.json
            reports/fichas-clasicas-pendientes.md
          if-no-files-found: ignore
