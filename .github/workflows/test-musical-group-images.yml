name: Regresion de imagenes de grupos musicales
on:
  pull_request:
    paths:
      - 'assets/vitruvia-discovery.js'
      - 'scripts/test-musical-group-images.mjs'
      - '.github/workflows/test-musical-group-images.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check assets/vitruvia-discovery.js
      - run: node scripts/test-musical-group-images.mjs
