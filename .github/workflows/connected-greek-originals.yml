name: Vitruvia y Lexicon · originales griegos TEI
on:
  pull_request:
    paths:
      - 'assets/classics-corpus-search.js'
      - 'vitruvia.html'
      - 'vitruvia-lexicon.html'
      - 'scripts/test-connected-greek-originals.mjs'
      - 'scripts/test-shared-semantic-index-usage.mjs'
      - 'scripts/classics-visor-smoke.mjs'
      - '.github/workflows/connected-greek-originals.yml'
  push:
    branches: [main]
    paths:
      - 'assets/classics-corpus-search.js'
      - 'vitruvia.html'
      - 'vitruvia-lexicon.html'
      - 'scripts/test-connected-greek-originals.mjs'
      - 'scripts/test-shared-semantic-index-usage.mjs'
      - 'scripts/classics-visor-smoke.mjs'
      - '.github/workflows/connected-greek-originals.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interconnection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Syntax
        run: node --check assets/classics-corpus-search.js
      - name: Verify documentary connections
        run: |
          node scripts/test-connected-greek-originals.mjs
          node scripts/test-shared-semantic-index-usage.mjs
