name: Ampliar clásicos griegos y latinos en R2 sin borrar GitHub
run-name: Bibliotheca R2 · lote conservador de 12 grupos · ${{ github.event_name }}
# Tanda acotada para incorporación verificable: máximo 12 grupos nuevos por ejecución.
# Mantener manuscritos, PDF, traducciones y versiones previas sin sustituirlos.
# Solicitud 2026-11-16 (segunda tanda): publicar únicamente objetos nuevos con licencia y fuente verificadas.
# Solicitud editorial 2026-11-16: continuar lote conservador hasta 12 grupos, sin sobrescrituras.
# Nueva solicitud 2026-11-17: incorporar solo grupos no existentes y verificar antes de contar obras.
# Solicitud adicional 2026-11-17: ampliar Bibliotheca con otro lote seguro; ejecutar solo si la cola anterior ha terminado.
# Solicitud 2026-11-17: nuevo lote de clásicos hacia la meta de 500, con indexación de los originales que superen validaciones.
# Revisión 2026-11-17: ejecutar siguiente lote solo con fuentes no duplicadas, CTS corregidos y pruebas de extracción.
# Continuación 2026-11-22: incorporar más originales latinos y griegos a R2, sin repetir obras, con SHA y lector verificados.
# Nueva tanda 2026-11-22: tras 11 originales publicados, continuar adquisiciones TEI griegas y latinas solo con códigos CTS no repetidos.
on:
  workflow_dispatch:
  schedule:
    # Ocho tandas durante las 24 horas, cada 3 horas. Las traducciones
    # se intercalan y comparten concurrencia para proteger R2 y el catálogo.
    - cron: '17 0,3,6,9,12,15,18,21 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-classics-r2.yml'
      - 'scripts/expand-classics-r2.py'
      - 'scripts/check-bibliotheca-github-metadata-only.py'
      - 'scripts/test-bibliotheca-no-delete.py'
      - 'scripts/test-bibliotheca-versioning.py'
      - 'assets/classics-text-reader.js'
      - 'classics-text-reader.html'
      - 'scripts/test-expand-classics-r2.py'
      - 'scripts/audit-classical-corpus.mjs'
      - 'scripts/reconcile-perseus-provenance-expansion.mjs'
      - 'scripts/build-r2-expansion-index.mjs'
      - 'scripts/publish-r2-expansion-index.py'
permissions:
  contents: write
concurrency:
  group: vdl-classics-expansion-r2
  cancel-in-progress: false
jobs:
  expand:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --quiet 'boto3>=1.36,<2'
      - name: Probar extracción, licencias y preservación
        run: python scripts/test-expand-classics-r2.py
      - name: Bloquear eliminación y sustitución de versiones
        run: |
          python scripts/test-bibliotheca-no-delete.py
          python scripts/test-bibliotheca-versioning.py
          node --check assets/classics-text-reader.js
      - name: Reconciliar metadatos de cobertura y validar traducciones antes de incorporar originales
        run: |
          node --check scripts/reconcile-perseus-provenance-expansion.mjs
          python scripts/sync-classics-coverage.py
          node scripts/audit-classical-corpus.mjs
      - name: Incorporar todo original admisible y preservar textos de GitHub
        run: python -u scripts/expand-classics-r2.py --publish --workers 4 --limit 12
      - name: Construir y comprobar índice de pasajes en R2
        run: |
          node --max-old-space-size=11000 scripts/build-r2-expansion-index.mjs /tmp/vdl-classics-expansion
          python scripts/publish-r2-expansion-index.py /tmp/vdl-classics-expansion
      - name: Actualizar desde el catálogo más reciente y publicar sólo referencias verificadas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git pull --ff-only origin main
            python scripts/expand-classics-r2.py --finalize
            python scripts/sync-classics-coverage.py
            python scripts/sync-bibliotheca-github-r2.py
            node scripts/reconcile-perseus-provenance-expansion.mjs
            node scripts/test-perseus-provenance.mjs
            node scripts/audit-classical-corpus.mjs
            git add data/bibliotheca-graeca-latina-I-bce-I-ce.json data/classics-corpus/search-registry.json data/r2/classics-expansion-index.json data/r2/classics-expansion-manifest.json data/classics-corpus/coverage-audit.json data/classics-corpus/translation-availability-222.json data/r2/bibliotheca-inventario-unificado.json data/cifras-corpus.json data/perseus-provenance-audit.json perseus-procedencia-textual.html
            python scripts/check-bibliotheca-github-metadata-only.py
            if git diff --cached --quiet; then break; fi
            git commit -m 'Incorporar originales TEI en R2 con índices, procedencia y preservación de GitHub'
            if git push origin HEAD:main; then break; fi
            # Preserve the attempted commit; resolve against current main by
            # checking it out separately, then regenerate from verified objects.
            git fetch origin main
            git checkout -B "expansion-retry-$attempt" origin/main
            if [ "$attempt" -eq 5 ]; then exit 1; fi
          done
      - name: Resumen auditable de obras incorporadas y rechazadas
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ["GITHUB_STEP_SUMMARY"])
          p=Path("/tmp/vdl-classics-expansion/prepared.json")
          if not p.exists():
              out.open("a",encoding="utf-8").write("### Bibliotheca · importación sin reporte verificable\\nNo se declara ninguna obra nueva. Revisar el paso de extracción.\\n")
          else:
              j=json.loads(p.read_text(encoding="utf-8"))
              # Previously uploaded editions may be included in the cumulative
              # index, and are never counted as new books.
              new=j.get("prepared",[])
              failed=j.get("deferred",[])
              lines=["### Bibliotheca · originales de esta tanda",
                     f"Preparadas y verificadas para R2: **{len(new)}**; observaciones/rechazos: **{len(failed)}**.",
                     "La preparación no acredita publicación final ni incremento del catálogo."]
              lines += [f"- {row.get('author','')} — {row.get('title','')} ({row.get('language','')}) · `{row.get('workId','')}`" for row in new]
              if failed:
                  lines += ["#### Fuentes diferidas"]
                  lines += [f"- `{row.get('workId',row.get('path',''))}`: {row.get('reason','No documentado')}" for row in failed[:30]]
              out.open("a",encoding="utf-8").write("\\n".join(lines)+"\\n")
          PY
      - name: Conservar diagnóstico y diferencias pendientes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classics-expansion-verification
          path: |
            /tmp/vdl-classics-expansion/prepared.json
            /tmp/vdl-classics-expansion/index-descriptor.json
          retention-days: 30
