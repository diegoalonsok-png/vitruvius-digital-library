name: Site integrity checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check navigation, core data and JS syntax
        run: npm run check:site
