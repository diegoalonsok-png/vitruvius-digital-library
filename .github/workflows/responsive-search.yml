name: Responsive literal search and editorial records
on:
  push:
    branches: ['main', 'codex/responsive-search-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/test-responsive-literal.mjs
          node scripts/test-lexicon-literal-exact.mjs
          node scripts/test-lexicon-query-contract.mjs
          node scripts/test-search-url-contract.mjs
          node scripts/test-vitruvia-search-contract.mjs
          node scripts/test-vitruvia-restored-search.mjs
          node scripts/test-search-quality-fixtures.mjs
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - run: |
          mkdir -p reports
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/responsive-server.log 2>&1 &
          node scripts/benchmark-responsive-search.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-search-audit
          path: reports/responsive-*
          retention-days: 30
