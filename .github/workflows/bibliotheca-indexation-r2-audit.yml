name: Bibliotheca — auditoría y conciliación de índices GitHub/R2
on:
  schedule:
    - cron: "45 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bibliotheca-indexation-r2-audit.yml'
      - 'scripts/audit-bibliotheca-indexation.mjs'
      - 'data/r2/classics-expansion-manifest.json'
      - 'data/r2/classics-expansion-index.json'
      - 'data/classics-corpus/search-registry.json'
permissions:
  contents: write
concurrency:
  group: vdl-classics-publication-main
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Sincronizar base de trabajo desde main
        run: |
          git fetch --quiet origin main
          git checkout -B vdl-publication origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar cliente de R2
        run: python -m pip install --quiet "boto3>=1.36"
      - name: Conciliar todas las obras registradas y los índices TEI de GitHub y R2
        run: node scripts/audit-bibliotheca-indexation.mjs --strict
      - name: Conciliar inventario federado sin inventar relaciones
        run: python scripts/sync-bibliotheca-github-r2.py
      - name: Comprobar R2 real y manifiesto de índices
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: vitruvius-bibliotheca
        run: python scripts/audit-r2-object-presence.py
      - name: Publicar solo resúmenes reproducibles y panel de estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/classics-corpus/unindexed-backlog.json data/r2/bibliotheca-indexation-status.json data/r2/r2-object-status.json data/r2/bibliotheca-inventario-unificado.json reports/bibliotheca/indexation-control.json reports/bibliotheca/r2-live-integrity.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bibliotheca: conciliación diaria de índices GitHub/R2"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then exit 0; fi
            if test -d .git/rebase-merge || test -d .git/rebase-apply; then git rebase --abort; exit 1; fi
            sleep 8
          done
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bibliotheca-indexation-audit
          path: |
            reports/bibliotheca/indexation-control.json
            reports/bibliotheca/r2-live-integrity.json
            data/r2/bibliotheca-indexation-status.json
            data/r2/r2-object-status.json
          if-no-files-found: ignore
