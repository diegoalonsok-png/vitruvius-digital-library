name: Verificar lectura paralela multilingüe
on:
  push:
    paths:
      - 'classics-parallel-reader.html'
      - 'classics-text-reader.html'
      - 'assets/classics-text-reader.js'
      - 'scripts/test-parallel-two-versions.mjs'
      - '.github/workflows/parallel-two-versions.yml'
  pull_request:
    paths:
      - 'classics-parallel-reader.html'
      - 'classics-text-reader.html'
      - 'assets/classics-text-reader.js'
      - 'scripts/test-parallel-two-versions.mjs'
      - '.github/workflows/parallel-two-versions.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check assets/classics-text-reader.js
      - run: node scripts/test-parallel-two-versions.mjs
