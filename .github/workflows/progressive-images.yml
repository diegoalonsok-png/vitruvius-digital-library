name: Fast first image results
on:
  pull_request:
    paths:
      - 'assets/vitruvia-image-engine-v2.js'
      - 'scripts/test-progressive-images.mjs'
      - '.github/workflows/progressive-images.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check assets/vitruvia-image-engine-v2.js
      - run: node scripts/test-progressive-images.mjs
      - run: node scripts/test-lightweight-images.mjs
      - run: node scripts/test-image-fallback.mjs
