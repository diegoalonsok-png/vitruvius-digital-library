name: Lexicon · traducciones trazables por pasaje
on:
  pull_request:
    paths:
      - 'assets/lexicon-classics-bridge.js'
      - 'assets/vitruvia-lexicon.js'
      - 'assets/classics-corpus-search.js'
      - 'vitruvia-lexicon.html'
      - 'scripts/test-lexicon-passage-translations.mjs'
      - '.github/workflows/lexicon-passage-translations.yml'
  push:
    branches: [main]
    paths:
      - 'assets/lexicon-classics-bridge.js'
      - 'assets/vitruvia-lexicon.js'
      - 'assets/classics-corpus-search.js'
      - 'vitruvia-lexicon.html'
      - 'scripts/test-lexicon-passage-translations.mjs'
      - '.github/workflows/lexicon-passage-translations.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/lexicon-classics-bridge.js
      - run: node scripts/test-lexicon-passage-translations.mjs
