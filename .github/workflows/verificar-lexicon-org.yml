name: Verificar publicación Lexicon en dominio .org

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vitruvia-lexicon.html'
      - 'assets/site-bar.js'
      - '.github/workflows/verificar-lexicon-org.yml'

permissions:
  contents: read

concurrency:
  group: verificacion-lexicon-org
  cancel-in-progress: true

jobs:
  verificar:
    name: Confirmar que vitruvius-digital-library.org refleja GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verificar controles actuales de Lexicon en GitHub
        run: |
          set -euo pipefail
          grep -Fq 'id="lx-only-vitruvius"' vitruvia-lexicon.html
          grep -Fq '<span class="lx-sub">Lexicon</span>' vitruvia-lexicon.html
      - name: Verificar que el dominio .org publique Lexicon actualizado
        shell: bash
        run: |
          set -euo pipefail
          url="https://vitruvius-digital-library.org/vitruvia-lexicon.html"
          echo "Archivo fuente: vitruvia-lexicon.html (main)"
          echo "URL pública: $url"
          for attempt in $(seq 1 20); do
            echo "Intento $attempt/20"
            if curl --fail --location --silent --show-error \
               --connect-timeout 10 --max-time 25 \
               --header 'Cache-Control: no-cache' \
               "$url?verify_lexicon=${GITHUB_SHA}" -o /tmp/lexicon-org.html; then
              if grep -Fq 'id="lx-only-vitruvius"' /tmp/lexicon-org.html \
                 && grep -Fq '<span class="lx-sub">Lexicon</span>' /tmp/lexicon-org.html; then
                echo "OK: el dominio .org contiene el filtro Solo Vitruvio y Lexicon sin etiqueta beta."
                exit 0
              fi
              echo "El dominio responde, pero todavía no refleja los controles actuales de Lexicon."
            else
              echo "El dominio .org aún no respondió con HTTP 200."
            fi
            if [ "$attempt" -lt 20 ]; then sleep 20; fi
          done
          echo "::error::El dominio .org no refleja el HTML actualizado de Lexicon. Revisar la integración GitHub–Cloudflare, rama main y estado del despliegue."
          exit 1
