name: Lexicon · desambiguación veritas/ueritas
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/classical-lexicon.js'
      - 'scripts/test-lexicon-veritas-lemma.mjs'
      - '.github/workflows/lexicon-veritas-lemma.yml'
  push:
    branches: [main]
    paths:
      - 'assets/classical-lexicon.js'
      - 'scripts/test-lexicon-veritas-lemma.mjs'
      - '.github/workflows/lexicon-veritas-lemma.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/test-lexicon-veritas-lemma.mjs
