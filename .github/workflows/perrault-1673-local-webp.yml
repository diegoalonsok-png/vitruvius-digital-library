name: Publicar Perrault 1673 WebP locales
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/perrault-1673-local-webp.yml'
permissions:
  contents: write
concurrency:
  group: perrault-1673-webp-publisher
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Descargar y optimizar únicamente los folios de 1673
        run: |
          python scripts/download-perrault-1673.py --start 1 --count 370
      - name: Confirmar miniaturas, imágenes y manifiesto verificable
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/perrault/1673 data/perrault-local-1673.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(perrault): publish verified lightweight 1673 WebP folios and thumbnails"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
