name: Indexar corpus clásico por lotes e integrar tres buscadores

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/mass-index-classics.py'
      - 'scripts/audit-classics-222-roadmap.py'
      - 'scripts/test-mass-index-completeness.py'
      - 'scripts/audit-classics-222-roadmap.py'
      - 'scripts/test-classics-historical-translations.py'
      - 'data/classics-corpus/*-en.json'
      - 'scripts/repair-classics-mixed-tei.py'
      - '.github/workflows/classics-mass-index.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/classics-mass-index.yml'
      - 'scripts/mass-index-classics.py'
      - 'scripts/audit-classics-222-roadmap.py'
      - 'scripts/repair-classics-mixed-tei.py'
      - 'scripts/test-classics-historical-translations.py'
  schedule:
    - cron: '26 2,8,14,20 * * *'

permissions:
  contents: write

concurrency:
  group: classics-corpus-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrity-test:
    name: Pruebas de integridad del extractor TEI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/ingest_texts.py scripts/mass-index-classics.py scripts/test-mass-index-completeness.py scripts/test-classics-historical-translations.py scripts/repair-classics-mixed-tei.py
      - run: python scripts/test-mass-index-completeness.py
      - run: python scripts/test-classics-historical-translations.py
  index-and-validate:
    if: github.event_name != 'pull_request'
    needs: integrity-test
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ingestar originales verificables y publicar sólo tras pruebas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/repair-classics-mixed-tei.py
            # Completar hasta 4 lotes sobre el mismo árbol verificado. Cada lote
            # refresca el registro; sin avances salimos, sin fabricar registros.
            for batch in 1 2 3 4; do
              echo "Indexación de originales: lote $batch/4"
              result="$(python scripts/mass-index-classics.py --max-new 16)"
              printf '%s\n' "$result"
              count="$(printf '%s' "$result" | python -c 'import json,sys; print(json.load(sys.stdin)["indexedInThisRun"])')"
              if [ "$count" -eq 0 ]; then
                echo "Sin más originales TEI disponibles para incorporar automáticamente."
                break
              fi
            done
            python scripts/audit-classics-222-roadmap.py
            if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard data/classics-corpus)" ]; then
              echo 'No hay nuevos originales TEI incorporables en este lote.'
              exit 0
            fi
            node scripts/audit-classical-corpus.mjs
            python scripts/audit-classics-coverage.py --strict
            node scripts/test-classics-integration.mjs
            python scripts/test-classics-historical-translations.py
            python scripts/build_classics_semantic_index.py
            python scripts/audit-classics-222-roadmap.py
            git add data/bibliotheca-graeca-latina-I-bce-I-ce.json
            git add data/classics-corpus
            git add data/classics-corpus/indexation-roadmap-222.json
            if git diff --cached --quiet; then
              echo 'Sin cambios registrables.'
              exit 0
            fi
            git commit -m 'Reparar TEI truncadas e indexar originales para Vitruvia, Lexicon y Bibliotheca'
            if git push origin HEAD:main; then
              echo 'Lote publicado después de auditoría técnica.'
              exit 0
            fi
            echo "::warning::main cambió durante el proceso; reconstruyendo desde la última versión ($attempt/6)"
            sleep "$((attempt * 2))"
          done
          echo '::error::No fue posible publicar sin conflicto tras seis intentos.'
          exit 1
