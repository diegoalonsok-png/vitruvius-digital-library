name: Generate English and French editorial page translations
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-static-page-translations.py'
      - '.github/workflows/generate-page-translations.yml'
  schedule:
    - cron: '19 3,9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: editorial-page-translation-build
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-page-translations.txt
      - name: Install offline translation tools
        run: python -m pip install -r scripts/requirements-page-translations.txt
      - name: Cache translation models
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/share/argos-translate/packages
            ~/.local/share/argos-translate/downloads
          key: argos-es-en-fr-v1
      - name: Generate and validate editorial translations
        run: |
          python scripts/test-static-page-translations.py
          python scripts/build-static-page-translations.py --limit 12
      - name: Count completed translation packages
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=[]
          for p in Path('data/i18n-pages').glob('*.json'):
              try:data.append(json.loads(p.read_text()))
              except Exception:continue
          good=sum(x.get('complete') is True for x in data)
          partial=len(data)-good
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write(f'## Traducciones editoriales de Vitruvius\n\n')
              out.write(f'- Páginas con archivos de idioma: **{len(data)}**\n')
              out.write(f'- Páginas completas según extracción estática: **{good}**\n')
              out.write(f'- Páginas parcialmente traducidas: **{partial}**\n')
              out.write('No incluye textos dinámicos, PDF ni revisión filológica humana.\n')
          PY
      - name: Commit generated dictionaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/i18n-pages
          if git diff --cached --quiet; then
            echo "No new dictionaries to commit"
          else
            git commit -m "i18n: traducir nuevos textos editoriales ES a EN y FR"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
