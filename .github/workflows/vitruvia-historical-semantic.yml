name: Vitruvia web and historical paragraph quality
on:
  pull_request:
    paths:
      - 'assets/vitruvia-web-routing.js'
      - 'assets/vitruvia-search.js'
      - 'assets/vitruvia-historical-paragraphs.js'
      - 'assets/historical-ocr-highlight.js'
      - 'assets/historical-ocr-highlight.css'
      - 'assets/historical-paragraph-search.mjs'
      - 'assets/historical-search.mjs'
      - 'assets/cesariano-visual-search.mjs'
      - 'scripts/test-historical-yellow-highlights.mjs'
      - 'cesariano-1521.html'
      - 'indexacion-historica-parrafos.html'
      - 'buscador-parrafos-vitruvio.html'
      - 'scripts/test-vitruvia-historical-paragraphs.mjs'
      - 'assets/historical-paragraph-segmentation.js'
      - 'assets/historical-semantic-search.js'
      - 'scripts/build-historical-paragraph-index.mjs'
      - 'scripts/test-vitruvia-web-routing.mjs'
      - 'vitruvia.html'
      - 'concordancia-historica.html'
      - '.github/workflows/vitruvia-historical-semantic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check assets/vitruvia-web-routing.js
          node --check assets/vitruvia-search.js
          node --check assets/vitruvia-historical-paragraphs.js
          node --check assets/historical-ocr-highlight.js
          node --check assets/historical-paragraph-search.mjs
          node --check assets/cesariano-visual-search.mjs
          node --check assets/historical-search.mjs
          node --check scripts/test-historical-yellow-highlights.mjs
          node --check scripts/test-vitruvia-historical-paragraphs.mjs
          node --check assets/historical-paragraph-segmentation.js
          node --check assets/historical-semantic-search.js
          node --check scripts/build-historical-paragraph-index.mjs
      - name: Route sources by topic
        run: node scripts/test-vitruvia-web-routing.mjs
      - name: Check historical OCR semantics and unverified IIIF anchors
        run: node scripts/test-vitruvia-historical-paragraphs.mjs
      - name: Check yellow OCR paragraph highlighting in Rose and Cesariano
        run: node scripts/test-historical-yellow-highlights.mjs
      - name: Verify OCR paragraph-to-page offsets
        run: node scripts/build-historical-paragraph-index.mjs --audit-only
