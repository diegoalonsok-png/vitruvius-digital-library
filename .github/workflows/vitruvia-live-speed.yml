name: Vitruvia · velocidad real de resultados en dos dominios
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/benchmark-vitruvia-live-speed.mjs'
      - '.github/workflows/vitruvia-live-speed.yml'
permissions:
  contents: read
jobs:
  speed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME_BIN" ]; then
            echo "CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Medir carga y primer resultado (Cloudflare y GitHub Pages)
        run: |
          node --check scripts/benchmark-vitruvia-live-speed.mjs
          node scripts/benchmark-vitruvia-live-speed.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vitruvia-live-speed-results
          path: reports/vitruvia-live-speed.json
          if-no-files-found: warn
