name: Bibliotheca — verificación pública de R2 y visores
on:
  schedule:
    - cron: "18 9 * * *"
  workflow_dispatch:
  push:
    paths:
      - "bibliotheca-ampliada.html"
      - "classics-r2-parallel.html"
      - "taccola-de-machinis.html"
      - "scripts/test-bibliotheca-publicacion-online.py"
permissions:
  contents: read
jobs:
  smoke-publico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar Bibliotheca, lectores, índice, fichas académicas y objetos R2 públicos
        run: python scripts/test-bibliotheca-publicacion-online.py
