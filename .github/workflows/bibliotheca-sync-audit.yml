name: Bibliotheca — sincronización y auditoría GitHub / R2
on:
  push:
    paths:
      - ".github/workflows/bibliotheca-sync-audit.yml"
      - "scripts/audit-bibliotheca-federada.mjs"
      - "scripts/sync-bibliotheca-github-r2.py"
      - "data/r2/vinculos-repertorio.json"
      - "scripts/audit-bibliotheca-r2-live.py"
      - "scripts/audit-r2-object-presence.py"
      - "scripts/audit-r2-orphan-ingestions.py"
      - "scripts/build-bibliotheca-ocr-coverage.py"
      - "scripts/test-bibliotheca-ocr-coverage.mjs"
      - "scripts/audit-bibliotheca-lexical-live.mjs"
      - "assets/r2-clasicos-busqueda.js"
      - "scripts/sync-classics-coverage.py"
      - "data/classics-corpus/early-witness-links-2026-11.json"
      - "scripts/test-early-witness-reading.mjs"
      - "assets/classics-early-witness-links.js"
      - "data/r2/catalogo-clasicos-r2.json"
      - "data/r2/r2-orphan-reconciliation.json"
      - "data/r2/clasicos-candidatos.json"
      - "data/r2/indice-semantico-manifest.json"
      - "data/index/classics-r2/manifest.json"
      - "scripts/test-r2-reconciliation-integrity.mjs"
      - "data/r2/recatalogacion-pendiente-2026-11-16.json"
      - "data/r2/corpus-manifest.json"
      - "data/classics-corpus/search-registry.json"
      - "scripts/sync-registered-local-edition-languages.py"
      - "data/classics-corpus/translation-availability-222.json"
      - "data/classics-corpus/coverage-audit.json"
      - "data/bibliotheca-graeca-latina-I-bce-I-ce.json"
      - "data/bibliotheca-expansion-publicada-2026-11-16.json"
      - "scripts/test-bibliotheca-expansion-2026-11.mjs"
      - "data/index/classics/manifest.json"
      - "data/classics-corpus/**-grc.json"
      - "data/classics-corpus/**-la.json"
      - "scripts/build-classics-lexical-index.mjs"
      - "scripts/build-r2-classics-lexical-index.mjs"
      - "scripts/audit-classical-corpus.mjs"
  # 02:50 UTC = 23:50 del día anterior en Buenos Aires (UTC-3).
  # Se conserva el control matutino de 07:35 hora argentina.
  schedule:
    - cron: "50 2 * * *"
    - cron: "35 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vdl-classics-publication-main
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - name: Sincronizar base de trabajo desde main
        run: |
          git fetch --quiet origin main
          git checkout -B vdl-publication origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar cliente de almacenamiento
        run: python -m pip install --quiet "boto3>=1.36"
      - name: Identidad catalográfica y sincronización de obras y versiones
        run: |
          node scripts/test-r2-reconciliation-integrity.mjs
          node scripts/audit-bibliotheca-federada.mjs --strict
          python scripts/sync-bibliotheca-github-r2.py
          python scripts/cifras-corpus.py
          python scripts/sync-classics-coverage.py
      # A new GitHub work may be recorded minutes before its lexical shards
      # are published by the independent indexer. Never skip R2 verification
      # because of this temporary local index lag.
      - name: Detectar atraso del índice local sin bloquear la auditoría R2
        id: lexical_parity
        continue-on-error: true
        run: node scripts/test-bibliotheca-expansion-2026-11.mjs
      - name: Comprobar claves de objetos e IDs del índice R2
        run: python scripts/audit-bibliotheca-r2-live.py --required
      - name: Verificar cada PDF y OCR catalogado por HEAD, SHA declarado y manifiesto
        run: python scripts/audit-r2-object-presence.py --required
      - name: Examinar la procedencia de PDF y OCR todavía no catalogados
        run: python scripts/audit-r2-orphan-ingestions.py --required
      # Build the public panel AFTER the physical S3 audit; building it only
      # before HEAD/GET kept yesterday's R2 figures next to today's new books.
      - name: Reconstruir panel e inventario con el R2 recién comprobado
        run: |
          node scripts/audit-bibliotheca-federada.mjs --strict
          python scripts/sync-bibliotheca-github-r2.py
      - name: Catalogar cobertura de OCR, sin confundirla con texto crítico
        run: |
          python scripts/build-bibliotheca-ocr-coverage.py
          node scripts/test-bibliotheca-ocr-coverage.mjs
      - name: Cotejar palabras y páginas reales del índice R2 y abrir visores
        run: node scripts/audit-bibliotheca-lexical-live.mjs --required --full
      - name: Integridad de lectura y fusión semántica
        run: |
          node scripts/test-r2-indice-fusion.mjs
          node scripts/test-r2-indice-clasicos.mjs
          node scripts/test-r2-busqueda-clasicos.mjs
          node scripts/test-classics-integration.mjs
          node scripts/test-early-witness-reading.mjs
          node scripts/audit-classical-corpus.mjs
      - name: Publicar el panel de estado con evidencias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/r2/bibliotheca-panel-sync.json data/r2/bibliotheca-r2-live-audit.json data/r2/bibliotheca-inventario-unificado.json data/r2/r2-object-status.json data/cifras-corpus.json data/classics-corpus/coverage-audit.json data/classics-corpus/translation-availability-222.json data/r2/r2-orphan-reconciliation.json data/r2/bibliotheca-ocr-coverage.json data/r2/bibliotheca-lexical-live-audit.json data/r2/bibliotheca-greek-ocr-triage.json reports/bibliotheca/r2-live-integrity.json
          if git diff --cached --quiet; then echo "Sin cambios en el panel"; exit 0; fi
          git commit -m "Bibliotheca: sincronizar inventario y prueba R2"
          pushed=false
          for i in 1 2 3 4 5; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then pushed=true; break; fi
            if test -d .git/rebase-merge || test -d .git/rebase-apply; then
              git rebase --abort
              echo "::error::Conflicto de publicación: no se sobrescriben metadatos de otra ejecución."
              exit 1
            fi
            sleep 6
          done
          test "$pushed" = true
      - name: Publicar resumen de cierre diario — sin afirmar éxito si hay fallos
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LEXICAL_OUTCOME: ${{ steps.lexical_parity.outcome }}
        run: |
          python - <<'PY'
          import os, json, pathlib, datetime
          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=-3)))
          report=pathlib.Path("data/r2/bibliotheca-r2-live-audit.json")
          objects=pathlib.Path("data/r2/r2-object-status.json")
          rows=["### Bibliotheca · cierre y sincronización GitHub ↔ R2",
                f"**Fecha y hora argentina:** {now:%Y-%m-%d %H:%M} (UTC-3)",
                f"**Estado del trabajo:** {os.environ['JOB_STATUS']}",
                "**Política:** sin borrado ni sobreescritura automática de libros; los objetos no identificados permanecen preservados."]
          if report.is_file():
              d=json.loads(report.read_text())
              rows += [f"**Auditoría R2:** {d.get('status','desconocido')}",
                       f"**Índice facsimilar:** {d.get('count',{}).get('indexListedWorks','sin dato')} entradas",
                       f"**Incidencias registradas:** {len(d.get('issues',[]))}"]
          if objects.is_file():
              d=json.loads(objects.read_text())
              c=d.get('counts',{})
              rows += [f"**PDF/OCR verificados:** {c.get('objectsPresent','sin dato')} / {c.get('objectsChecked','sin dato')}",
                       f"**Objetos faltantes:** {c.get('objectsMissing','sin dato')}"]
          rows.append("**Paridad léxica local:** "+os.environ.get('LEXICAL_OUTCOME','sin comprobar'))
          if os.environ.get('LEXICAL_OUTCOME') == 'failure':
              rows.append("**Atención:** hay una entrada local registrada sin índice publicado; se conservó y auditó R2 igualmente.")
          if os.environ['JOB_STATUS'] != 'success':
              rows.append("**Atención:** la ejecución no certifica sincronización completa; revisar el registro de errores.")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write("\n\n".join(rows)+"\n")
          PY
      - name: Archivar diagnóstico
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bibliotheca-auditoria-federada
          path: |
            data/r2/bibliotheca-panel-sync.json
            data/r2/bibliotheca-r2-live-audit.json
            data/r2/bibliotheca-inventario-unificado.json
            data/r2/r2-object-status.json
            data/r2/r2-orphan-reconciliation.json
            data/r2/bibliotheca-ocr-coverage.json
            data/r2/bibliotheca-lexical-live-audit.json
            data/classics-corpus/coverage-audit.json
            reports/bibliotheca/r2-live-integrity.json
          if-no-files-found: ignore

      - name: Declarar índice local pendiente sin invalidar las comprobaciones R2
        if: steps.lexical_parity.outcome == 'failure'
        run: |
          echo "::error::El catálogo contiene alguna edición cuyo índice local aún no está publicado. Se verificó R2 independientemente; revisar el flujo de indexación."
          exit 1
