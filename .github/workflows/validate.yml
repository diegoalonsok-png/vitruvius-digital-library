name: Validar sitio Vitruvio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar sintaxis de JavaScript
        run: |
          node --check assets/app.js
          node --check assets/search-worker.js
          node --check assets/historical-search.mjs
          node --check assets/indices-locorum.mjs
          node --check assets/bilingual.js
          node --check assets/latin-suggest.js
          node --check assets/theme.js
          node --check assets/studies.js
          node --check assets/bibliography.js
          node --check assets/history-core.mjs
          node scripts/test-history.mjs
          node scripts/test-citations.mjs
          node scripts/test-no-voseo.mjs
          node scripts/test-search.mjs
          node --test scripts/test-query-discovery.mjs
          node scripts/test-vitruvia-discovery.mjs
          node --check assets/vitruvia-academic-reader.js
          node scripts/test-vitruvia-academic-reader.mjs
          node scripts/test-vitruvia-dictation.mjs
          node scripts/test-vitruvia-resilience.mjs
          node scripts/test-vitruvia-entity-priority.mjs
          node scripts/test-vitruvia-author-reading.mjs
          node scripts/test-classical-catalogue-integrity.mjs
          node scripts/audit-classical-corpus.mjs
          node scripts/test-public-site-integrity.mjs
          node --check assets/concordancia-ocr-vitruvio.js
          node scripts/test-historical-parallel-ocr.mjs
          node scripts/test-krohn-ocr-index.mjs
          node scripts/audit-classical-translation-coverage.mjs
          node --check assets/classics-corpus-search.js
          node --check assets/vitruvia-search.js
          node --check assets/bibliotheca-graeca-latina.js
          node --check assets/vitruvia-selection-speech.js
          node scripts/test-vitruvia-selection-speech.mjs
          node --check assets/vitruvia-photo-background.js
          node scripts/test-vitruvia-photo-background.mjs
          node --check assets/vitruvia-visual-import.js
          node --check assets/vitruvia-pdf-local.js
          node scripts/test-vitruvia-visual-import.mjs
          node scripts/test-vitruvia-pdf-local.mjs
          node --check assets/vitruvia-search.js
          node --check assets/vitruvia-entity-resolver.js
          node --check assets/research-folder.js
          node --check assets/papyrology-ostraca.js
          node --check assets/papyrology-ink.js
          node --check assets/papyrology-glyphs.js
      - name: Comprobar catálogo y archivos publicados
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path(".")
          cat=json.loads((root/"data/catalog.json").read_text(encoding="utf-8"))
          historical=json.loads((root/"data/historical.json").read_text(encoding="utf-8"))
          inventory=json.loads((root/"data/corpus-expansion-inventory.json").read_text(encoding="utf-8"))
          assert len(cat["editions"])>=3
          assert len(historical)>=20
          assert len(inventory["records"])>=74
          assert len({r["id"] for r in cat["editions"]})==len(cat["editions"])
          for e in cat["editions"]:
            if e.get("available"):
              assert (e.get("external") and e.get("read_url", "").startswith("https://")) or (e.get("pdf") and (root/e["pdf"]).is_file()),f"Missing PDF: {e['id']}"
            if e.get("searchable"):
              assert e.get("text_index") and (root/e["text_index"]).is_file(),f"Missing index: {e['id']}"
              data=json.loads((root/e["text_index"]).read_text(encoding="utf-8"))
              assert isinstance(data,list) and len(data)==e["pages"],f"Page count mismatch: {e['id']}"
          print("JS y catálogo válidos. Índices publicados:",sum(bool(e.get("searchable")) for e in cat["editions"]))
          PY

      - name: Auditoría reproducible de vínculos, buscador e índices
        run: |
          python scripts/audit_site.py
          test -s concordancia-historica.html
          test -s assets/historical-search.mjs
          test -s data/text/krohn-1912.json
          python scripts/test-editorial.py

