name: Bibliotheca → Lexicon · conservar búsqueda
on:
  pull_request:
    paths:
      - 'bibliotheca-graeca-latina.html'
      - 'assets/vitruvia-lexicon.js'
      - 'scripts/test-bibliotheca-lexicon-handoff.mjs'
      - '.github/workflows/bibliotheca-lexicon-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar que la consulta viaje de Bibliotheca a Lexicon
        run: |
          node --check scripts/test-bibliotheca-lexicon-handoff.mjs
          node scripts/test-bibliotheca-lexicon-handoff.mjs
