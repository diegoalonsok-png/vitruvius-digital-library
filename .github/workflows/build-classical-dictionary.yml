name: Generar diccionario clásico indexado
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-classical-dictionary.yml'
      - 'scripts/build-classical-dictionary.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-classical-dictionary
      cancel-in-progress: false
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Descargar las fuentes lexicográficas de acceso abierto
        run: |
          mkdir -p /tmp/classical
          curl --fail --location --retry 5 --connect-timeout 30 --max-time 5400 \
            'https://kaikki.org/dictionary/Latin/kaikki.org-dictionary-Latin.jsonl' -o /tmp/classical/Latin.jsonl
          curl --fail --location --retry 5 --connect-timeout 30 --max-time 3600 \
            'https://kaikki.org/dictionary/Ancient%20Greek/kaikki.org-dictionary-AncientGreek.jsonl' -o /tmp/classical/AncientGreek.jsonl
          test -s /tmp/classical/Latin.jsonl
          test -s /tmp/classical/AncientGreek.jsonl
      - name: Indexar lemas y definiciones presentes en el corpus
        run: |
          python scripts/build-classical-dictionary.py \
            --latin /tmp/classical/Latin.jsonl \
            --greek /tmp/classical/AncientGreek.jsonl
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('data/classical-dictionary.json')
          d=json.loads(p.read_text())
          print('Tamaño:', round(p.stat().st_size/1024/1024,2), 'MB')
          print('Entradas:', d['counts'])
          assert d['counts']['latin']>1000, 'Cobertura latina inesperadamente baja'
          assert p.stat().st_size<80*1024*1024, 'Índice demasiado grande para el sitio'
          PY
      - name: Publicar índice generado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/classical-dictionary.json
          if ! git diff --cached --quiet; then
            git commit -m "Publicar diccionario latino-griego derivado del corpus"
            git push origin HEAD:main
          fi
