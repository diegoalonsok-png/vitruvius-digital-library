name: Audit classical corpus coverage

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/classics-corpus/**'
      - 'data/structured/**'
      - 'corpus/**'
      - 'scripts/audit-classics-coverage.py'
      - '.github/workflows/audit-classics-coverage.yml'

permissions:
  contents: read

jobs:
  corpus-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit registered sources, reader URLs and locus overlaps
        run: python scripts/audit-classics-coverage.py
      - name: Upload reproducible coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classics-corpus-coverage
          path: reports/classics-corpus-coverage.json
          if-no-files-found: warn
