name: Audit classical corpus coverage

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/classics-corpus/**'
      - 'data/structured/**'
      - 'corpus/**'
      - 'scripts/audit-classics-coverage.py'
      - 'scripts/test-classics-integration.mjs'
      - 'assets/lexicon-classics-bridge.js'
      - 'assets/classics-corpus-search.js'
      - 'vitruvia-lexicon.html'
      - 'cobertura-traducciones-clasicas.html'
      - '.github/workflows/audit-classics-coverage.yml'

permissions:
  contents: read

jobs:
  corpus-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Audit registered sources, reader URLs and locus overlaps
        run: python scripts/audit-classics-coverage.py
      - name: Verify integration of Bibliotheca Vitruvia and Lexicon
        run: |
          node --check assets/lexicon-classics-bridge.js
          node --check assets/translation-coverage.js
          node scripts/test-classics-integration.mjs
      - name: Upload reproducible coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: classics-corpus-coverage
          path: reports/classics-corpus-coverage.json
          if-no-files-found: warn
