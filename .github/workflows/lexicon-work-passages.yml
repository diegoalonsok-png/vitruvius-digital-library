name: Lexicon · listados y pasajes verificados
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/lexicon-classics-bridge.js'
      - 'scripts/test-lexicon-work-passages.mjs'
      - '.github/workflows/lexicon-work-passages.yml'
  push:
    branches: [main]
    paths:
      - 'assets/lexicon-classics-bridge.js'
      - 'scripts/test-lexicon-work-passages.mjs'
      - '.github/workflows/lexicon-work-passages.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/test-lexicon-work-passages.mjs
