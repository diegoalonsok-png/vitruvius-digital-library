name: Vitruvia search geometry in Chromium
on:
  push:
    paths:
      - 'vitruvia.html'
      - 'assets/vitruvia-*.css'
      - 'assets/vitruvia-image-engine-v2.js'
      - 'assets/vitruvia-egypt-research.js'
      - 'assets/vitruvia-egypt-script-viewer.js'
      - 'scripts/test-vitruvia-search-geometry.mjs'
      - '.github/workflows/vitruvia-search-geometry.yml'
  pull_request:
    paths:
      - 'vitruvia.html'
      - 'assets/vitruvia-*.css'
      - 'assets/vitruvia-image-engine-v2.js'
      - 'assets/vitruvia-egypt-research.js'
      - 'assets/vitruvia-egypt-script-viewer.js'
      - 'scripts/test-vitruvia-search-geometry.mjs'
      - '.github/workflows/vitruvia-search-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Chromium browser test dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check real rendered width, source panels, and mobile layout
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/vitruvia-geometry-http.log 2>&1 &
          sleep 2
          node scripts/test-vitruvia-search-geometry.mjs
      - name: Save layout screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitruvia-search-layout
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
