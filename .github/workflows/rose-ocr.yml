name: Indexar OCR Rose 1899
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/parse-ia-djvu-pages.py'
      - '.github/workflows/rose-ocr.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Descargar OCR de páginas de Rose desde Internet Archive
        run: |
          curl --fail --location --retry 4 --connect-timeout 25 'https://archive.org/download/vitruviidearchit00vitr_0/vitruviidearchit00vitr_0_djvu.xml' -o /tmp/rose.xml
          python scripts/parse-ia-djvu-pages.py /tmp/rose.xml data/text/rose-1899.json
      - name: Publicar índice y verificar cobertura
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/text/rose-1899.json'))
          assert len(d)>250
          assert sum(len(p['text']) for p in d)>100000
          print('Rose OCR',len(d),'pages')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/text/rose-1899.json
          if ! git diff --cached --quiet; then git commit -m "Indexar OCR histórico Rose 1899"; git push origin HEAD:main; fi
