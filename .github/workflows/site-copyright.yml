name: Pie legal de Editorial Sophia Lux
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/ensure-site-copyright.mjs"
      - ".github/workflows/site-copyright.yml"
permissions:
  contents: write
concurrency:
  group: site-copyright-main
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply notice to every tracked HTML page
        run: |
          node scripts/ensure-site-copyright.mjs --write
          node scripts/ensure-site-copyright.mjs --check
      - name: Commit and publish only HTML footer updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "All HTML pages already carry the legal footer."
            exit 0
          fi
          git commit -m "legal: show Sophia Lux and Diego Kurilo notice on every HTML page"
          git push origin HEAD:main
