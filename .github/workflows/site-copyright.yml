name: Pie legal de Editorial Sophia Lux
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "**/*.html"
      - "scripts/ensure-site-copyright.mjs"
      - ".github/workflows/site-copyright.yml"
permissions:
  contents: write
concurrency:
  group: site-copyright-main
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Start from latest main without overwriting other sessions
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Apply notice to every tracked HTML page
        run: |
          node scripts/ensure-site-copyright.mjs --write
          node scripts/ensure-site-copyright.mjs --check
      - name: Commit and publish only HTML footer updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "All HTML pages already carry the legal footer."
            exit 0
          fi
          git commit -m "legal: show Sophia Lux and Diego Kurilo notice on every HTML page"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { echo "Concurrent edits conflict; stop instead of overwriting."; exit 1; }
          done
          echo "Could not publish copyright footer after safe retries."
          exit 1
