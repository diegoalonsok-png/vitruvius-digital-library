name: Rebuild classics search index and public counts

on:
  push:
    paths:
      - 'data/classics-corpus/*-grc.json'
      - 'data/classics-corpus/*-la.json'
      - 'data/classics-corpus/search-registry.json'
      - 'data/bibliotheca-expansion-publicada-2026-11-16.json'
      - 'scripts/build-classics-lexical-index.mjs'
      - 'scripts/refresh-classics-public-counts.mjs'
      - 'data/cifras-corpus.json'
      - 'scripts/audit-unindexed-classics.mjs'
      - 'scripts/check-classics-new-index.mjs'
      - 'scripts/test-classical-phrase-matching.mjs'
      - '.github/workflows/classics-index-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classics-index-refresh
  cancel-in-progress: false

jobs:
  rebuild:
    # LEGACY DESACTIVADO: impedir nuevos fragmentos de índice en GitHub.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate search root shards and manifest
        run: node --max-old-space-size=6144 scripts/build-classics-lexical-index.mjs
      - name: Audit missing, local pending and remote-unverified editions
        run: node scripts/audit-unindexed-classics.mjs
      - name: Derive truthful public counters from checked index and audit
        run: node scripts/refresh-classics-public-counts.mjs
      - name: Check new works are indexed at source-locus granularity
        run: node scripts/check-classics-new-index.mjs
      - name: Probar cobertura de textos originales y traducciones incorporadas
        run: node scripts/check-registered-originals-translations-indexed.mjs
      - name: Check literal phrases in Latin and polytonic Greek
        run: node scripts/test-classical-phrase-matching.mjs
      - name: Commit regenerated indexes without editing source books
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index/classics data/classics-corpus/public-counts.json data/classics-corpus/unindexed-audit.json data/cifras-corpus.json
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild classics lexical index and measured catalogue counts"
            git push
          fi
