name: Audit Vitruvius search responsiveness and errors
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-vitruvius-search-browser.mjs'
      - '.github/workflows/audit-vitruvius-search-browser.yml'
permissions:
  contents: read
jobs:
  public-search-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install isolated Playwright browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Vitruvia, Bibliotheca, Lexicon, network and JS errors
        run: node scripts/audit-vitruvius-search-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vitruvius-public-search-audit
          path: audit-output/vitruvius-browser-smoke.json
          if-no-files-found: warn
