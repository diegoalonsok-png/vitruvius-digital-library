name: Comprobar textos de los visores
on:
  schedule:
    - cron: "23 10 * * 3"
  workflow_dispatch:
  pull_request:
    paths: ["data/clasicos-perseus*.json", "data/bibliotheca-*.json"]
jobs:
  texts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: node scripts/texts-availability-check.mjs
