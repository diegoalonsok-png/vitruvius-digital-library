name: Academic integrity and editorial backlog
on:
  push:
    paths:
      - 'scripts/audit-academic-readiness.mjs'
      - 'scripts/academic-integrity.mjs'
      - 'scripts/test-codicological-source-consistency.mjs'
      - 'data/academic-integrity.json'
      - 'assets/apparatus-ecdotics.mjs'
      - 'assets/apparatus-catalog.mjs'
      - 'assets/critical-lexical-bridge.js'
      - 'assets/apparatus-edition-bibliography.js'
      - 'aparato-critico.html'
      - 'data/catalog.json'
      - 'scripts/test-apparatus-ecdotics.mjs'
      - 'scripts/test-apparatus-dictionary-click.mjs'
      - 'assets/inline-lexical-card.js'
      - 'data/bibliotheca-graeca-latina-I-bce-I-ce.json'
      - 'data/bibliotheca-testimonia-verified.json'
      - 'data/classics-corpus/tei-codicology-research-matrix-89.json'
      - 'data/clasicos-perseus-extra.json'
      - 'data/structured/**'
      - 'assets/academic-integrity.js'
      - 'control-academico.html'
      - 'scripts/audit-scholarly-evidence.mjs'
      - 'assets/scholarly-evidence-panel.js'
      - 'assets/classics-corpus-counts.js'
      - 'data/ecdotic-decisions.json'
      - 'data/classics-corpus/indexation-roadmap-222.json'
      - 'data/classics-corpus/search-registry.json'
      - 'data/classics-corpus/coverage-audit.json'
      - 'data/classics-alignment/**'
      - 'data/structured/latin-collation-audit.json'
      - 'data/lexicon/etymologicum.json'
      - 'auditoria-academica.html'
      - '.github/workflows/academic-integrity.yml'
  pull_request:
    paths:
      - 'scripts/audit-academic-readiness.mjs'
      - 'scripts/academic-integrity.mjs'
      - 'scripts/test-codicological-source-consistency.mjs'
      - 'data/academic-integrity.json'
      - 'assets/apparatus-ecdotics.mjs'
      - 'assets/apparatus-catalog.mjs'
      - 'assets/critical-lexical-bridge.js'
      - 'assets/apparatus-edition-bibliography.js'
      - 'aparato-critico.html'
      - 'data/catalog.json'
      - 'scripts/test-apparatus-ecdotics.mjs'
      - 'scripts/test-apparatus-dictionary-click.mjs'
      - 'assets/inline-lexical-card.js'
      - 'data/bibliotheca-graeca-latina-I-bce-I-ce.json'
      - 'data/bibliotheca-testimonia-verified.json'
      - 'data/classics-corpus/tei-codicology-research-matrix-89.json'
      - 'data/clasicos-perseus-extra.json'
      - 'data/structured/**'
      - 'assets/academic-integrity.js'
      - 'control-academico.html'
      - 'scripts/audit-scholarly-evidence.mjs'
      - 'assets/scholarly-evidence-panel.js'
      - 'assets/classics-corpus-counts.js'
      - 'data/ecdotic-decisions.json'
      - 'data/classics-corpus/indexation-roadmap-222.json'
      - 'data/classics-corpus/search-registry.json'
      - 'data/classics-corpus/coverage-audit.json'
      - 'data/classics-alignment/**'
      - 'data/structured/latin-collation-audit.json'
      - 'data/lexicon/etymologicum.json'
      - 'auditoria-academica.html'
      - '.github/workflows/academic-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scholarly-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ecdotic apparatus bibliography, exact loci and dictionary controls
        run: |
          node --check assets/apparatus-ecdotics.mjs
          node --check assets/apparatus-catalog.mjs
          node --check assets/critical-lexical-bridge.js
          node scripts/test-apparatus-ecdotics.mjs
      - name: Test actual dictionary opening on highlighted apparatus words
        run: |
          npm install --no-save --no-audit --no-fund jsdom@31
          node scripts/test-apparatus-dictionary-click.mjs
      - name: Confirm published integrity data matches current immutable sources
        run: node scripts/academic-integrity.mjs --check
      - name: Verify codicological dossier fields and British Library references
        run: node scripts/test-codicological-source-consistency.mjs
      - name: Validate scholarly metadata and generate the backlog
        run: node scripts/audit-academic-readiness.mjs
      - name: Cross-check texts, sources and editorial evidence
        run: node scripts/audit-scholarly-evidence.mjs
      - name: Publish reproducible audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-readiness-report
          path: |
            reports/academic-readiness.json
            reports/scholarly-evidence.json
          if-no-files-found: warn
