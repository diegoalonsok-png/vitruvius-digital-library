name: Rose y Krohn — visor y búsquedas
on:
  push:
    paths:
      - 'rose-1899.html'
      - 'krohn-1912.html'
      - 'lectura-comparada.html'
      - 'data/r2/folios/*-parallel.json'
      - 'assets/modern-edition-*'
      - 'assets/rose-krohn-harleianus-reader.mjs'
      - 'scripts/test-modern-edition-*'
      - 'scripts/build-modern-edition-parallel-index.mjs'
      - '.github/workflows/rose-krohn-reader.yml'
  pull_request:
    paths:
      - 'rose-1899.html'
      - 'krohn-1912.html'
      - 'lectura-comparada.html'
      - 'data/r2/folios/*-parallel.json'
      - 'assets/modern-edition-*'
      - 'assets/rose-krohn-harleianus-reader.mjs'
      - 'scripts/test-modern-edition-*'
      - 'scripts/build-modern-edition-parallel-index.mjs'
permissions:
  contents: read
jobs:
  readers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-package-lock
      - run: |
          node --check assets/rose-krohn-harleianus-reader.mjs
          node --check assets/modern-edition-search.mjs
          node scripts/test-modern-edition-search.mjs
          node scripts/test-modern-edition-reader.mjs
          node --check assets/modern-edition-parallel.mjs
          node scripts/test-modern-edition-parallel.mjs
          node scripts/test-krohn-locus-sync.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pymupdf pillow
      - run: python scripts/test-modern-edition-import.py
