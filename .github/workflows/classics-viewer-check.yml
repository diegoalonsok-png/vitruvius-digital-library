name: Verificar visores PDF y códices clásicos
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/classics-viewer-check.yml'
      - 'scripts/classics-visor-smoke.mjs'
      - 'assets/classics-corpus-search.js'
      - 'assets/bibliotheca-corpus-search.js'
      - 'assets/lexicon-classics-bridge.js'
      - 'vitruvia.html'
      - 'vitruvia-lexicon.html'
  push:
    paths:
      - '.github/workflows/classics-viewer-check.yml'
      - 'scripts/classics-visor-smoke.mjs'
      - 'scripts/test-bibliotheca-chronology.mjs'
      - 'scripts/test-bibliotheca-language-policy.mjs'
      - 'scripts/test-remote-translation-registry.mjs'
      - 'data/classics-corpus/remote-translations.json'
      - 'bibliotheca-graeca-latina.html'
      - 'classics-text-reader.html'
      - 'assets/bibliotheca-simple.css'
      - 'assets/bibliotheca-simple.js'
      - 'assets/bibliotheca-corpus-search.js'
      - 'assets/bibliotheca-viewers-lexicon.css'
      - 'assets/classics-text-reader.js'
      - 'data/classics-corpus/source-scope.json'
      - 'data/classics-corpus/coverage-audit.json'
      - 'data/classics-corpus/search-registry.json'
      - 'assets/classical-facsimile-viewer.js'
      - 'assets/bibliotheca-graeca-latina.js'
      - 'assets/vitruvia-search.js'
      - 'data/bibliotheca-graeca-latina-I-bce-I-ce.json'
      - 'data/bibliotheca-testimonia-verified.json'
      - 'documents/classics/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Syntax of classical interfaces and the regression script
        run: |
          node --check scripts/classics-visor-smoke.mjs
          node --check assets/bibliotheca-graeca-latina.js
          node --check assets/classical-facsimile-viewer.js
          node --check assets/vitruvia-search.js
          node --check assets/bibliotheca-simple.js
      - name: Verificar que los siglos latinos y griegos se ordenan correctamente
        run: |
          node scripts/test-bibliotheca-chronology.mjs
          node scripts/test-remote-translation-registry.mjs
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify in a real browser the five PDFs, cross-index, page navigation and IIIF links
        run: node scripts/classics-visor-smoke.mjs
