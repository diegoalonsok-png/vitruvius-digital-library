name: Bibliotheca - cotejo integral de titulos e interiores (solo lectura)

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit-bibliotheca-full-integrity.py"
      - "scripts/audit-book-interiors.py"
      - ".github/workflows/bibliotheca-full-interior-audit.yml"
      - "data/bibliotheca-graeca-latina-I-bce-I-ce.json"
      - "data/bibliotheca-expansion-publicada-2026-11-16.json"
      - "data/classics-corpus/search-registry.json"
      - "data/r2/catalogo-clasicos-r2.json"
      - "data/r2/vinculos-repertorio.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bibliotheca-content-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalogue-and-originals:
    name: Catálogo federado y conciliación de fuentes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sintaxis del auditor
        run: python -m py_compile scripts/audit-bibliotheca-full-integrity.py
      - name: Conciliar obras, manifestaciones, duplicados y huerfanos
        run: python scripts/audit-bibliotheca-full-integrity.py --mode inventory --output reports/bibliotheca/full-integrity-inventory.json
      - name: Anotar resultados y controles pendientes
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("## Cotejo de la Bibliotheca: obra, titulo, original y estructura\n\n")
              for name in ("inventory",):
                  path=pathlib.Path(f"reports/bibliotheca/full-integrity-{name}.json")
                  if not path.exists():
                      out.write(f"- {name}: no se genero un informe integro.\n")
                      continue
                  doc=json.loads(path.read_text(encoding="utf-8"))
                  out.write(f"- {name}: {doc['counts']}\n\n")
              out.write("\nNo se ha certificado la integridad de ninguna obra por un mero control automatico.\n")
          PY
      - name: Conservar evidencias para revision academica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bibliotheca-integrity-inventory-${{ github.run_id }}
          path: reports/bibliotheca/full-integrity-*.json
          if-no-files-found: warn
          retention-days: 90

  text-versions:
    name: Textos y traducciones desde ${{ matrix.start }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        start: [0, 200, 400, 600, 800, 1000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspeccionar lote de originales y traducciones
        env:
          START: ${{ matrix.start }}
        run: |
          limit=200
          if [ "$START" = 1000 ]; then limit=0; fi
          python scripts/audit-bibliotheca-full-integrity.py --mode texts --start "$START" --limit "$limit" --output "reports/bibliotheca/full-integrity-texts-$START.json"
      - uses: actions/upload-artifact@v4
        with:
          name: bibliotheca-integrity-texts-${{ matrix.start }}-${{ github.run_id }}
          path: reports/bibliotheca/full-integrity-texts-*.json
          if-no-files-found: error
          retention-days: 90

  printed-editions:
    name: PDF y OCR R2 (ediciones desde ${{ matrix.start }})
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        start: [0, 30, 60, 90]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencia para verificar PDFs realmente descargados
        run: python -m pip install --disable-pip-version-check "pymupdf>=1.24,<2"
      - name: Determinar alcance del lote final sin omitir nuevas ediciones
        id: edition_batch
        shell: bash
        run: |
          limit=30
          if [ "${{ matrix.start }}" = 90 ]; then
            limit=$(python -c 'import json; print(max(30,len(json.load(open("data/r2/catalogo-clasicos-r2.json"))["items"])-90))')
          fi
          echo "limit=$limit" >> "$GITHUB_OUTPUT"
      - name: Examinar OCR de todas las paginas por edicion
        run: |
          python scripts/audit-bibliotheca-full-integrity.py \
            --mode ocr --start ${{ matrix.start }} --limit ${{ steps.edition_batch.outputs.limit }} \
            --output reports/bibliotheca/full-integrity-ocr-${{ matrix.start }}.json
      - name: Descargar y cotejar PDF con portada, ultimos folios, paginas intermedias, hash y cantidad de paginas
        run: |
          python scripts/audit-book-interiors.py \
            --start ${{ matrix.start }} --limit ${{ steps.edition_batch.outputs.limit }} \
            --output reports/bibliotheca/full-integrity-pdf-${{ matrix.start }}.json
      - name: Publicar incidencias del lote en GitHub Actions
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib,collections
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("## Correspondencia titulo / interior de PDF y OCR\n\n")
              for kind in ("ocr","pdf"):
                  p=pathlib.Path("reports/bibliotheca/full-integrity-"+kind+"-${{ matrix.start }}.json")
                  if not p.exists():
                      out.write(f"{kind}: informe no disponible.\n");continue
                  doc=json.loads(p.read_text(encoding="utf-8"))
                  total=collections.Counter(x.get("status") for x in doc.get("results",[]))
                  out.write(f"- {kind}: {len(doc.get('results',[]))} ediciones examinadas - {dict(total)}\n")
              out.write("\nLos casos dudosos permanecen abiertos. No se modifican libros, codices, folios, traducciones ni registros originales.\n")
          PY
      - name: Archivar resultados individuales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bibliotheca-integrity-editions-${{ matrix.start }}-${{ github.run_id }}
          path: reports/bibliotheca/full-integrity-*.json
          if-no-files-found: warn
          retention-days: 90

  publish-integrity:
    name: Publicar faltantes en las fichas académicas existentes
    needs: [catalogue-and-originals, text-versions, printed-editions]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: bibliotheca-integrity-*-${{ github.run_id }}
          path: /tmp/bibliotheca-integrity
          merge-multiple: true
      - name: Consolidar evidencias por obra, versión y facsímil
        run: |
          python scripts/audit-bibliotheca-full-integrity.py --mode publish --reports /tmp/bibliotheca-integrity
      - name: Publicar solamente el informe derivado si las fuentes no cambiaron
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bibliotheca-audit/integrity.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bibliotheca: publicar control estructural y faltantes por edición'
          git fetch origin main
          git diff --quiet "${GITHUB_SHA}" origin/main -- data/bibliotheca-graeca-latina-I-bce-I-ce.json data/bibliotheca-expansion-publicada-2026-11-16.json data/r2/ data/index/ data/classics-corpus/ data/structured/ data/critical-editions/ corpus/ data/bibliotheca-audit/integrity.json scripts/audit-bibliotheca-full-integrity.py scripts/audit-book-interiors.py || { echo 'Fuentes cambiadas; no publicar informe obsoleto'; exit 1; }
          git rebase origin/main
          git push origin HEAD:main
