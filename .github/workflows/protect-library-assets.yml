name: Protección de folios y ediciones madre
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verificar sintaxis y reglas no destructivas
        run: |
          node --check scripts/guard-library-assets.mjs
          node scripts/test-guard-library-assets.mjs
      - name: Comparar PR o push contra su base; prohibir borrados y documentos nuevos
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/guard-library-assets.mjs "$BASE_SHA" HEAD
