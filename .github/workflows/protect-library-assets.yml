name: Protección de folios y ediciones madre
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verificar sintaxis y reglas no destructivas
        run: |
          node --check scripts/guard-library-assets.mjs
          node scripts/test-guard-library-assets.mjs
      - name: Comparar PR o push contra su base; prohibir borrados y documentos nuevos
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/guard-library-assets.mjs "$BASE_SHA" HEAD
