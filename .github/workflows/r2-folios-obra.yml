name: R2 — folios de una obra notable

# Baja los folios de una obra, uno por uno, y los aloja en Cloudflare R2, como
# se hizo con el Códex H. Al repositorio sólo vuelve el índice de folios, que es
# liviano. No borra nada y no rehospeda una digitalización cuyos derechos no lo
# permitan: eso lo decide data/r2/folios-fuentes.json.

on:
  workflow_dispatch:
    inputs:
      obra:
        description: "Clave de la obra en data/r2/folios-fuentes.json"
        required: true
        default: "palladio-quattro-libri"
      desde:
        description: "Primera imagen"
        default: "1"
      hasta:
        description: "Última imagen (0 = todas)"
        default: "0"
      ancho:
        description: "Ancho en píxeles de cada folio"
        default: "1800"
      prueba:
        description: "Bajar sólo N folios y no subir nada (0 = corrida real)"
        default: "0"
      miniatura:
        description: "Ancho de la miniatura para la galería (0 = sin miniaturas)"
        default: "260"
      solo_miniaturas:
        description: "No rebajar el folio completo: sólo las miniaturas"
        type: boolean
        default: false

concurrency:
  group: r2-folios-${{ inputs.obra }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  folios:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "boto3>=1.36"

      - name: Bajar los folios y subirlos a R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python scripts/r2-folios-obra.py \
            --obra "${{ inputs.obra }}" \
            --desde "${{ inputs.desde }}" \
            --hasta "${{ inputs.hasta }}" \
            --ancho "${{ inputs.ancho }}" \
            --miniatura "${{ inputs.miniatura }}" \
            --prueba "${{ inputs.prueba }}" \
            ${{ inputs.solo_miniaturas && '--solo-miniaturas' || '' }}

      - name: Guardar el índice de folios (solo el archivo liviano)
        if: ${{ inputs.prueba == '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/r2/folios
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Folios de ${{ inputs.obra }} alojados en R2"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 8; done
