name: Import documented historical proportion illustrations
on:
  push:
    paths:
      - 'scripts/import-vitruvian-images.py'
      - '.github/workflows/import-vitruvian-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download public-domain and CC-licensed reference images
        run: python scripts/import-vitruvian-images.py
      - name: Commit image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/hombre-vitruvio/
          if ! git diff --cached --quiet; then
            git commit -m "Host Taccola, Francesco di Giorgio and Durer historical images locally"
            git push
          fi
