name: Bibliotheca · originales griegos remotos
on:
  pull_request:
    paths:
      - 'assets/bibliotheca-offsite-greek.js'
      - 'assets/bibliotheca-corpus-search.js'
      - 'assets/bibliotheca-simple.js'
      - 'assets/classics-corpus-search.js'
      - 'assets/lexicon-classics-bridge.js'
      - 'assets/vitruvia-search.js'
      - 'scripts/test-connected-greek-originals.mjs'
      - 'scripts/test-three-way-classics-navigation.mjs'
      - 'vitruvia.html'
      - 'vitruvia-lexicon.html'
      - 'bibliotheca-graeca-latina.html'
      - 'classics-remote-text-reader.html'
      - 'scripts/test-bibliotheca-offsite-greek.mjs'
      - '.github/workflows/bibliotheca-offsite-greek.yml'
  push:
    branches: [main]
    paths:
      - 'assets/bibliotheca-offsite-greek.js'
      - 'assets/bibliotheca-corpus-search.js'
      - 'assets/bibliotheca-simple.js'
      - 'assets/classics-corpus-search.js'
      - 'assets/lexicon-classics-bridge.js'
      - 'assets/vitruvia-search.js'
      - 'scripts/test-connected-greek-originals.mjs'
      - 'scripts/test-three-way-classics-navigation.mjs'
      - 'vitruvia.html'
      - 'vitruvia-lexicon.html'
      - 'bibliotheca-graeca-latina.html'
      - 'classics-remote-text-reader.html'
      - 'scripts/test-bibliotheca-offsite-greek.mjs'
      - '.github/workflows/bibliotheca-offsite-greek.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-greek-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: |
          node --check assets/bibliotheca-offsite-greek.js
          node --check assets/bibliotheca-corpus-search.js
          node --check assets/bibliotheca-simple.js
          node --check assets/classics-corpus-search.js
          node --check assets/lexicon-classics-bridge.js
          node --check assets/vitruvia-search.js
      - run: |
          node scripts/test-bibliotheca-offsite-greek.mjs
          node scripts/test-connected-greek-originals.mjs
          node scripts/test-three-way-classics-navigation.mjs
