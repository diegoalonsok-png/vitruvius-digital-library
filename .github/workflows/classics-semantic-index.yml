name: Indexación semántica de clásicos
on:
  push:
    branches: [main]
    paths:
      - 'data/classics-corpus/*.json'
      - 'data/lexicon/fontes/*.json'
      - 'scripts/test-reused-classical-sources.mjs'
      - 'data/structured/*.json'
      - 'data/lexicon/conceptus.json'
      - 'scripts/build_classics_semantic_index.py'
      - '!data/classics-corpus/semantic-conceptus-postings.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: classics-corpus-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verificar reutilización de textos sin copias
        run: node scripts/test-reused-classical-sources.mjs
      - name: Construir índice por obras y loci
        run: python scripts/build_classics_semantic_index.py
      - name: Guardar índice reproducible sin sobrescribir commits concurrentes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebuild after fetching the latest main on each attempt: never push
          # an index calculated from a stale snapshot or force-push over work.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_classics_semantic_index.py
            git add data/classics-corpus/semantic-conceptus-postings.json
            if git diff --cached --quiet; then
              echo "Índice actualizado; no hay cambios pendientes."
              exit 0
            fi
            git commit -m "Actualizar índice semántico Conceptus"
            if git push origin HEAD:main; then
              echo "Índice publicado correctamente."
              exit 0
            fi
            echo "La rama main cambió durante la publicación; reintentando desde la versión actual ($attempt/5)."
            sleep "$((attempt * 2))"
          done
          echo "::error::No fue posible publicar el índice tras cinco intentos concurrentes."
          exit 1
