name: Vitruvian priority and classical readers
on:
  pull_request:
    paths:
      - 'assets/vitruvia-local-priority.js'
      - 'assets/vitruvia-classics-viewer.js'
      - 'assets/vitruvia-search.js'
      - 'vitruvia.html'
      - 'scripts/test-vitruvian-local-priority.mjs'
      - '.github/workflows/vitruvian-local-priority.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check assets/vitruvia-search.js
      - run: node --check assets/vitruvia-local-priority.js
      - run: node --check assets/vitruvia-classics-viewer.js
      - run: node scripts/test-vitruvian-local-priority.mjs
      - run: node scripts/test-vitruvia-author-reading.mjs
      - run: node scripts/test-query-discovery.mjs
