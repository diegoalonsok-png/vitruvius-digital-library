name: Import historical Greek-classics English translations
on:
  push:
    paths:
      - '.github/workflows/import-gutenberg-greek-translations-20261120.yml'
      - 'scripts/import-gutenberg-greek-translations-20261120.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download, verify and index historical English translations
        run: python3 scripts/import-gutenberg-greek-translations-20261120.py
      - name: Validate generated JSON and registry consistency
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/classics-corpus')
          r=json.loads((root/'search-registry.json').read_text())
          for e in r['entries']:
              if e.get('workId') in {'strabo','josephus-antiquities','josephus-war'} and e.get('language')=='en':
                  p=Path(e['path'])
                  data=json.loads(p.read_text())
                  assert data['passages'] and data['alignmentStatus']=='unaligned'
                  assert len(data['sourceFiles'])>0
          assert r['count']==len(r['entries'])
          assert r['works']==len({e['workId'] for e in r['entries']})
          PY
      - name: Commit only imported texts and search registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/classics-corpus/strabo-en.json data/classics-corpus/josephus-antiquities-en.json data/classics-corpus/josephus-war-en.json data/classics-corpus/search-registry.json
          if ! git diff --cached --quiet; then
            git commit -m 'Index historical English versions of three existing Greek classics'
            git push
          fi
