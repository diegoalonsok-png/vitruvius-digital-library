name: Detectar referencias por loci en PDF digitales
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-loci-candidates.yml'
      - 'scripts/build-loci-candidates.py'
permissions:
  contents: write
jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Detectar referencias explícitas en los textos
        run: python scripts/build-loci-candidates.py
      - name: Verificar salida
        run: python -m json.tool data/loci-candidates.json > /dev/null
      - name: Incorporar mapa de candidatos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/loci-candidates.json
          git diff --cached --quiet || (git commit -m "Build provisional loci candidate index from digital books" && git push)
