name: Publicar Rose y Krohn folio por folio en R2
on:
  push:
    paths:
      - 'scripts/publish-rose-krohn-folios-r2.py'
      - '.github/workflows/publish-rose-krohn-r2.yml'
  workflow_dispatch:
jobs:
  folios:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar disponibilidad de credenciales R2
        id: credentials
        env:
          ACCESS: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [[ -n "$ACCESS" && -n "$SECRET" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Faltan credenciales R2 para publicar folios: revisar R2_ACCESS_KEY_ID y R2_SECRET_ACCESS_KEY. No se publica un índice ficticio.'
          fi
      - name: Instalar conversor de PDF e interfaz R2
        if: steps.credentials.outputs.available == 'true'
        run: python -m pip install --disable-pip-version-check pymupdf pillow boto3
      - name: Publicar folios en R2 y comprobar cada imagen
        if: steps.credentials.outputs.available == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE: https://libros.vitruvius-digital-library.org
        run: python scripts/publish-rose-krohn-folios-r2.py --edition both --dpi 195
      - name: Conservar índices comprobados para revisión
        if: steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rose-krohn-indices-verificados
          path: |
            data/r2/folios/rose-1899*.json
            data/r2/folios/krohn-1912*.json
          if-no-files-found: error
