name: Verify edition discoverability
on:
  push:
    paths:
      - "documents/edicion-v*.html"
      - "documents/kurilo-*.pdf"
      - "scripts/audit-edition-discoverability.mjs"
      - "sitemap.xml"
      - "scripts/test-academic-sitemap.mjs"
      - "buscador-parrafos-vitruvio.html"
      - "centro-control-academico.html"
      - "citas-laboratorio.html"
      - "classics-collation.html"
      - "classics-facsimile-gallery.html"
      - "classics-manuscript-coverage.html"
      - "concordancia-ocr-vitruvio.html"
      - "indexacion-historica-parrafos.html"
      - "inventario-aparato-autoral.html"
      - "morfologia-laboratorio.html"
      - ".github/workflows/edition-discoverability.yml"
  pull_request:
    paths:
      - "documents/edicion-v*.html"
      - "documents/kurilo-*.pdf"
      - "scripts/audit-edition-discoverability.mjs"
      - "sitemap.xml"
      - "scripts/test-academic-sitemap.mjs"
      - "buscador-parrafos-vitruvio.html"
      - "centro-control-academico.html"
      - "citas-laboratorio.html"
      - "classics-collation.html"
      - "classics-facsimile-gallery.html"
      - "classics-manuscript-coverage.html"
      - "concordancia-ocr-vitruvio.html"
      - "indexacion-historica-parrafos.html"
      - "inventario-aparato-autoral.html"
      - "morfologia-laboratorio.html"
      - ".github/workflows/edition-discoverability.yml"
permissions:
  contents: read
jobs:
  verify-editions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check three edition landing pages and PDF metadata
        run: node scripts/audit-edition-discoverability.mjs
      - name: Verify canonical research pages and sitemap
        run: node scripts/test-academic-sitemap.mjs
