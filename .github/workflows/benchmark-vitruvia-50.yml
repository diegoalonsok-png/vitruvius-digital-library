name: Medición pública de 100 búsquedas Vitruvia
on:
  push:
    branches: [main]
    paths:
      - 'scripts/benchmark-vitruvia-50.mjs'
      - '.github/workflows/benchmark-vitruvia-50.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium para medición reproducible
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Medir apertura y 100 consultas reales sin alterar el sitio
        env:
          VITRUVIA_BENCHMARK_COUNT: '100'
        run: node scripts/benchmark-vitruvia-50.mjs
      - name: Conservar promedios y pruebas individuales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitruvia-100-search-timings
          path: reports/vitruvia-100-search-timings.json
          if-no-files-found: warn
          retention-days: 30
