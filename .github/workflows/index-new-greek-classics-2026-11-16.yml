name: Indexar lote griego 2026-11-16
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/index-new-greek-classics-2026-11-16.yml'
      - 'data/classics-corpus/callimachus-hymni-grc.json'
      - 'data/classics-corpus/theocritus-idyllia-grc.json'
      - 'data/classics-corpus/menander-dyskolos-grc.json'
      - 'data/classics-corpus/aristophanes-knights-grc.json'
      - 'data/classics-corpus/aristophanes-thesmophoriazusae-grc.json'
      - 'data/classics-corpus/aristophanes-ecclesiazusae-grc.json'
      - 'data/classics-corpus/aristophanes-plutus-grc.json'
      - 'data/classics-corpus/euripides-cyclops-grc.json'
      - 'data/classics-corpus/euripides-ion-grc.json'
      - 'data/classics-corpus/euripides-helena-grc.json'
      - 'data/bibliotheca-expansion-publicada-2026-11-16.json'
      - 'scripts/test-bibliotheca-expansion-2026-11.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: index-new-greek-classics-2026-11-16
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar fuentes e identificadores
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const names=['callimachus-hymni','theocritus-idyllia','menander-dyskolos','aristophanes-knights','aristophanes-thesmophoriazusae','aristophanes-ecclesiazusae','aristophanes-plutus','euripides-cyclops','euripides-ion','euripides-helena'];
          const registry=JSON.parse(fs.readFileSync('data/classics-corpus/search-registry.json','utf8'));
          for(const id of names){
            const f='data/classics-corpus/'+id+'-grc.json';
            const data=JSON.parse(fs.readFileSync(f,'utf8'));
            if(data.workId!==id||data.language!=='grc'||data.passages.length<200)throw Error('Corpus no válido: '+id);
            if(!registry.entries.some(e=>e.workId===id&&e.language==='grc'&&e.path===f))throw Error('No registrado: '+id);
          }
          JS
      - name: Regenerar índice léxico clásico
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/build-classics-lexical-index.mjs
      - name: Comprobar diez obras en el manifiesto
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('data/index/classics/manifest.json','utf8'));
          const entries=Array.isArray(m.index)?m.index:(Array.isArray(m.editions)?m.editions:[]);
          for(const id of ['callimachus-hymni','theocritus-idyllia','menander-dyskolos','aristophanes-knights','aristophanes-thesmophoriazusae','aristophanes-ecclesiazusae','aristophanes-plutus','euripides-cyclops','euripides-ion','euripides-helena'])
            if(!entries.some(x=>x.id===id&&x.lang==='grc'))throw Error('Falta en índice '+id);
          JS
      - name: Probar fichas, lectores, índices y alias editoriales de R2
        run: node scripts/test-bibliotheca-expansion-2026-11.mjs
      - name: Marcar fichas como indexadas sólo tras completar las pruebas
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path='data/bibliotheca-expansion-publicada-2026-11-16.json';
          const d=JSON.parse(fs.readFileSync(path,'utf8'));
          const index=JSON.parse(fs.readFileSync('data/index/classics/manifest.json','utf8')).index;
          const indexed=new Set(index.filter(x=>x.lang==='grc').map(x=>x.id));
          for(const w of d.works){
            if(!w.corpusFiles?.grc)continue;
            if(!indexed.has(w.id))throw Error('Cannot certify unindexed text: '+w.id);
            w.textStatus='lexically-indexed';
            w.status='Texto griego incorporado, registrado e indexado léxicamente; sin cotejo crítico independiente';
          }
          fs.writeFileSync(path,JSON.stringify(d,null,2)+'\\n');
          JS
      - name: Publicar índice y fichas certificadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/index/classics/ data/bibliotheca-expansion-publicada-2026-11-16.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'index: update Greek classics lexical shards'
          git pull --rebase origin main
          git push origin HEAD:main
