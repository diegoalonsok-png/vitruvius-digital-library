name: Bibliotheca — indexación automática de obras griegas y latinas
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/index-new-greek-classics-2026-11-16.yml'
      - 'data/classics-corpus/callimachus-hymni-grc.json'
      - 'data/classics-corpus/theocritus-idyllia-grc.json'
      - 'data/classics-corpus/menander-dyskolos-grc.json'
      - 'data/classics-corpus/aristophanes-knights-grc.json'
      - 'data/classics-corpus/aristophanes-thesmophoriazusae-grc.json'
      - 'data/classics-corpus/aristophanes-ecclesiazusae-grc.json'
      - 'data/classics-corpus/aristophanes-plutus-grc.json'
      - 'data/classics-corpus/euripides-cyclops-grc.json'
      - 'data/classics-corpus/euripides-ion-grc.json'
      - 'data/classics-corpus/euripides-helena-grc.json'
      - 'data/classics-corpus/*-grc.json'
      - 'data/classics-corpus/*-la.json'
      - 'data/classics-corpus/search-registry.json'
      - 'data/bibliotheca-expansion-publicada-2026-11-16.json'
      - 'scripts/test-bibliotheca-expansion-2026-11.mjs'
  # Reparación periódica de desajustes: si GitHub omite o cancela un evento push,
  # los índices se reconstruyen desde la última versión íntegra del repositorio.
  # 03:20 y 12:20 UTC = 00:20 y 09:20 en Buenos Aires.
  schedule:
    - cron: '20 3,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Publicador aislado: otros controles R2 no cancelan la indexación entrante.
  # Los conflictos al actualizar main se resuelven reconstruyendo desde HEAD actual.
  group: bibliotheca-classics-lexical-publisher
  cancel-in-progress: false
jobs:
  rebuild:
    # LEGACY DESACTIVADO: el índice léxico completo no debe crecer en GitHub.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validar fuentes e identificadores
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const names=JSON.parse(fs.readFileSync('data/bibliotheca-expansion-publicada-2026-11-16.json','utf8')).works.filter(w=>w.corpusFiles?.grc).map(w=>w.id);
          const registry=JSON.parse(fs.readFileSync('data/classics-corpus/search-registry.json','utf8'));
          for(const id of names){
            const f='data/classics-corpus/'+id+'-grc.json';
            const data=JSON.parse(fs.readFileSync(f,'utf8'));
            if(data.workId!==id||data.language!=='grc'||!Array.isArray(data.passages)||data.passages.length<1||data.passages.some(p=>!p.locus||!String(p.text||'').trim())||data.passages.reduce((n,p)=>n+String(p.text||'').length,0)<800||!(/^https:\/\//.test(data.source||'')||(Array.isArray(data.sources)&&data.sources.length>0&&data.sources.every(s=>/^https:\/\//.test(s.url||'')))))throw Error('Corpus no válido: '+id);
            if(!registry.entries.some(e=>e.workId===id&&e.language==='grc'&&e.path===f))throw Error('No registrado: '+id);
          }
          JS
      - name: Regenerar índice léxico clásico
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/build-classics-lexical-index.mjs
      - name: Comprobar todas las incorporaciones griegas del catálogo en el manifiesto
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('data/index/classics/manifest.json','utf8'));
          const entries=Array.isArray(m.index)?m.index:(Array.isArray(m.editions)?m.editions:[]);
          for(const id of JSON.parse(fs.readFileSync('data/bibliotheca-expansion-publicada-2026-11-16.json','utf8')).works.filter(w=>w.corpusFiles?.grc).map(w=>w.id))
            if(!entries.some(x=>x.id===id&&x.lang==='grc'))throw Error('Falta en índice '+id);
          JS
      - name: Probar fichas, lectores, índices y alias editoriales de R2
        run: node scripts/test-bibliotheca-expansion-2026-11.mjs
      - name: Acreditar que originales y traducciones registradas estén indexados por locus
        run: node scripts/check-registered-originals-translations-indexed.mjs
      - name: Marcar fichas como indexadas sólo tras completar las pruebas
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path='data/bibliotheca-expansion-publicada-2026-11-16.json';
          const d=JSON.parse(fs.readFileSync(path,'utf8'));
          const index=JSON.parse(fs.readFileSync('data/index/classics/manifest.json','utf8')).index;
          const indexed=new Set(index.filter(x=>x.lang==='grc').map(x=>x.id));
          for(const w of d.works){
            if(!w.corpusFiles?.grc)continue;
            if(!indexed.has(w.id))throw Error('Cannot certify unindexed text: '+w.id);
            w.textStatus='lexically-indexed';
            w.status='Texto griego incorporado, registrado e indexado léxicamente; sin cotejo crítico independiente';
          }
          fs.writeFileSync(path,JSON.stringify(d,null,2)+'\n');
          JS
      - name: Publicar índice desde el último main sin fusionar fragmentos generados
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Este repositorio cambia con frecuencia. Nunca hacer rebase/merge de
          # miles de fragmentos léxicos calculados sobre commits diferentes.
          # El reset opera SOLO dentro del runner efímero, no en el GitHub remoto.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git checkout -B vdl-lexical-publication origin/main
            echo "Reconstrucción sobre main vigente; intento $attempt"
            node scripts/build-classics-lexical-index.mjs
            node scripts/test-bibliotheca-expansion-2026-11.mjs
            node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file='data/bibliotheca-expansion-publicada-2026-11-16.json';
          const d=JSON.parse(fs.readFileSync(file,'utf8'));
          const m=JSON.parse(fs.readFileSync('data/index/classics/manifest.json','utf8'));
          const indexed=new Set(m.index.filter(x=>x.lang==='grc').map(x=>x.id));
          for(const w of d.works){
            if(!w.corpusFiles?.grc)continue;
            if(!indexed.has(w.id))throw Error('No publicar edición sin indexar: '+w.id);
            w.textStatus='lexically-indexed';
            w.status='Texto griego incorporado, registrado e indexado léxicamente; sin cotejo crítico independiente';
          }
          fs.writeFileSync(file,JSON.stringify(d,null,2)+'\n');
          JS
            python scripts/cifras-corpus.py
            git add data/index/classics/ data/bibliotheca-expansion-publicada-2026-11-16.json data/cifras-corpus.json
            if git diff --cached --quiet; then
              echo "Sin cambios: índice y fichas ya coinciden."
              exit 0
            fi
            git commit -qm "index: publish validated classical lexical index and academic fiches"
            if git push origin HEAD:main; then
              echo "Índice publicado y fichas certificadas desde main vigente."
              exit 0
            fi
            echo "::warning::Main avanzó durante la publicación; reconstruir sin rebase ni sobreescritura."
            sleep 5
          done
          echo "::error::No se publicó el índice por modificaciones concurrentes; los archivos remotos permanecen intactos."
          exit 1
