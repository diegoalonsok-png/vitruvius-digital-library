name: Indexación masiva TEI · Bibliotheca/Vitruvia/Lexicon
on:
  push:
    branches: [main]
    paths:
      - 'scripts/import-classics-perseus-batch.py'
      - 'scripts/test-classics-perseus-batch.py'
      - '.github/workflows/classics-bulk-ingestion.yml'
  pull_request:
    paths:
      - 'scripts/import-classics-perseus-batch.py'
      - 'scripts/test-classics-perseus-batch.py'
      - '.github/workflows/classics-bulk-ingestion.yml'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Máximo de nuevos originales TEI en este lote (1–12)'
        required: false
        type: number
        default: 10

permissions:
  contents: write

concurrency:
  group: classics-bulk-ingestion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-offline:
    name: Verificar catálogo, registro y selección CTS sin alterar la interfaz
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m py_compile scripts/ingest_texts.py scripts/import-classics-perseus-batch.py scripts/test-classics-perseus-batch.py
      - run: python scripts/test-classics-perseus-batch.py
      - run: node scripts/audit-classical-corpus.mjs
      - run: node scripts/test-classics-integration.mjs

  probe-import:
    name: Ensayo real de un original TEI sin publicarlo
    if: github.event_name == 'pull_request'
    needs: test-offline
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar una fuente TEI real y toda la cadena de indexación
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/import-classics-perseus-batch.py --max-new 1
      - name: Rechazar un ensayo sin incorporación verificable
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/classics-corpus/search-registry.json",encoding="utf-8"))
          assert d["count"]>50, "No se pudo indexar ninguna fuente TEI del inventario"
          print("Ensayo satisfactorio con",d["count"]-50,"versión adicional")
          PY
      - run: python scripts/build_classics_semantic_index.py
      - run: node scripts/audit-classical-corpus.mjs
      - run: node scripts/test-classics-integration.mjs
      - run: python scripts/audit-classics-coverage.py --strict

  ingest-batch:
    name: Importar originales verificados y actualizar los tres índices
    if: github.event_name != 'pull_request'
    needs: test-offline
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Incorporar documentos TEI con validación de fuente y copia XML
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ inputs.max_new }}
        run: python scripts/import-classics-perseus-batch.py --max-new "${LIMIT:-10}"
      - name: Regenerar índice semántico desde fuentes incorporadas
        run: python scripts/build_classics_semantic_index.py
      - name: Comprobar registro único, cobertura, lectores y enlaces cruzados
        run: |
          node scripts/audit-classical-corpus.mjs
          node scripts/test-classics-integration.mjs
          node scripts/test-classical-catalogue-integrity.mjs
          python scripts/audit-classics-coverage.py --strict
      - name: Guardar incorporaciones sin modificar HTML, CSS ni scripts de interfaz
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/classics-tei/ data/classics-corpus/ data/bibliotheca-graeca-latina-I-bce-I-ce.json
          if git diff --cached --quiet; then
            echo "No se incorporaron nuevos originales verificados: sin commit."
            exit 0
          fi
          git commit -m "Indexar lote verificado de originales griegos y latinos Perseus"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
