name: Auditoría SEO · Sitemap, canonicals y Dataset
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-site-technical-seo.mjs'
      - '.github/workflows/seo-indexability-audit.yml'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'index.html'
      - 'bibliotheca-graeca-latina.html'
      - 'obras-clasicas-indexadas.html'
      - 'obras/**'
      - 'collatio-autoptica.html'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Diagnóstico no destructivo de indexabilidad
        run: node scripts/audit-site-technical-seo.mjs
      - name: Guardar informe verificable
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seo-indexabilidad
          path: reports/seo/technical-indexability.json
          retention-days: 30
          if-no-files-found: warn
