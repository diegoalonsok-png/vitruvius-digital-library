name: Vitruvia semantic search regression

on:
  push:
    paths:
      - 'assets/vitruvia-ai.js'
      - 'data/ai-corpora.json'
      - 'scripts/test-vitruvia-ai.mjs'
      - '.github/workflows/vitruvia-semantic-regression.yml'
  pull_request:
    paths:
      - 'assets/vitruvia-ai.js'
      - 'data/ai-corpora.json'
      - 'scripts/test-vitruvia-ai.mjs'
      - '.github/workflows/vitruvia-semantic-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check BM25 and corpus evidence
        run: node scripts/test-vitruvia-ai.mjs
