name: Revisar todas las páginas
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/all-pages-check.mjs"
      - "scripts/benchmark-site-searches.mjs"
      - ".github/workflows/all-pages-check.yml"
  pull_request:
    paths: ["**.html", "assets/**", "scripts/all-pages-check.mjs", "scripts/benchmark-site-searches.mjs"]
permissions:
  contents: read
jobs:
  pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Playwright and locate preinstalled Chrome
        run: |
          npm i --no-save playwright@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME_BIN" ]; then
            echo "CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Start local document server
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/vitruvius-audit-server.log 2>&1 &
          sleep 2
      - name: Audit all pages, JavaScript, links, and visible controls
        run: node scripts/all-pages-check.mjs
      - name: Benchmark seven primary search forms
        if: always()
        run: node scripts/benchmark-site-searches.mjs
      - name: Check script syntax and static local links
        if: always()
        run: |
          node --check scripts/all-pages-check.mjs
          node --check scripts/benchmark-site-searches.mjs
          node scripts/audit-site-links.mjs
      - name: Upload reproducible performance and button inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitruvius-all-pages-search-performance
          path: |
            reports/all-pages-performance.json
            reports/site-search-latency.json
          if-no-files-found: warn
          retention-days: 30
