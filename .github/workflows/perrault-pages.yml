name: Perrault - espejar imagenes por pagina
on:
  workflow_dispatch:
    inputs:
      year:
        description: Edicion a procesar
        type: choice
        options: ['1673']
        default: '1673'
      batch:
        description: Imagenes nuevas por edicion
        default: '24'
        type: string
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: perrault-pages-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Extract optimized independent pages
        run: python scripts/perrault_pages.py --year "${{ inputs.year || '1673' }}" --batch "${{ inputs.batch || '24' }}"
      - name: Commit extracted pages and availability catalogs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/perrault/ data/perrault-local-1673.json
          if ! git diff --cached --quiet; then
            git commit -m "Perrault: cache incremental de paginas optimizadas"
            git push
          fi
