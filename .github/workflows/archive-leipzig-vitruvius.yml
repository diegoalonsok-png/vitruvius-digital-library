name: Archive Leipzig Vitruvius portrait locally
on:
  push:
    paths:
      - 'scripts/archive-leipzig-vitruvius.py'
      - '.github/workflows/archive-leipzig-vitruvius.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download verified public domain Leipzig portrait
        run: python scripts/archive-leipzig-vitruvius.py
      - name: Commit historical portrait image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/retratos/
          if ! git diff --cached --quiet; then
            git commit -m "Archive Leipzig Vitruvius imaginary portrait locally"
            git push
          fi
