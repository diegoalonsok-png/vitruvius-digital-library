name: Evaluación continua de Vitruvia (fuentes reales)
on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Evaluar el Destacado con consultas de referencia
        run: |
          pip install playwright==1.48.0
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          CHROME=$(which google-chrome || which chromium-browser) python scripts/eval-vitruvia-live.py --out evaluacion-vitruvia.json
      - uses: actions/upload-artifact@v4
        with: { name: evaluacion-vitruvia, path: evaluacion-vitruvia.json }
