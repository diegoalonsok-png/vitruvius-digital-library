name: Bibliotheca dual reader regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/bibliotheca-graeca-latina.js'
      - 'assets/bibliotheca-text-reader.js'
      - 'assets/parallel-highlights.mjs'
      - 'data/structured/*.json'
      - 'scripts/test-bibliotheca-parallel-highlights.mjs'
      - 'assets/classics-study-tools.js'
      - 'bibliotheca-graeca-latina.html'
      - 'lector-textual-rapido.html'
      - 'data/classics-corpus/caesar-gallico-*.json'
      - 'scripts/test-bibliotheca-dual-reader.mjs'
      - 'bibliotheca-capitula.html'
      - 'assets/bibliotheca-capitula.js'
      - 'assets/bibliotheca-capitula.css'
      - 'scripts/test-bibliotheca-capitula.mjs'
      - '.github/workflows/test-bibliotheca-dual-reader.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/classics-study-tools.js
          node --check assets/bibliotheca-graeca-latina.js
          node --check assets/bibliotheca-text-reader.js
          node --check assets/parallel-highlights.mjs
          node --check assets/bibliotheca-capitula.js
      - name: Validate Latin-English loci, black defaults and source wiring
        run: |
          node scripts/test-bibliotheca-dual-reader.mjs
          node scripts/test-bibliotheca-parallel-highlights.mjs
          node scripts/test-bibliotheca-capitula.mjs
