name: Importar grabado histórico de Vitruvio (Bernardi–Raggio)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-bernardi-vitruvio.yml'
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Descargar copia completa de dominio público y validar procedencia
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request, json, hashlib, time
          url='https://upload.wikimedia.org/wikipedia/commons/9/9f/Vitruvio_Pollione_portrait.jpg'
          dest=pathlib.Path('images/grabados/vitruvio-pollione-bernardi-raggio.jpg')
          headers={'User-Agent':'VitruviusDigitalLibrary/1.0 (academic project; Wikimedia Commons public-domain print)','Accept':'image/jpeg'}
          data=None
          # Same Munich inventory image gs95013d may be available through the institutional portrait index.
          download_source=None
          sources=[
              url,
              'https://www.portraitindex.de/pool/large/gs95013d',
              'https://www.portraitindex.de/pool/medium/gs95013d',
          ]
          for candidate in sources:
              try:
                  with urllib.request.urlopen(urllib.request.Request(candidate,headers=headers),timeout=50) as response:
                      content_type=response.headers.get('Content-Type','')
                      raw=response.read(9_000_000)
                  if not content_type.startswith('image/') or not raw.startswith(bytes.fromhex('ffd8ff')) or len(raw)<35_000:
                      raise ValueError('Respuesta no es JPEG completo: '+content_type+', bytes '+str(len(raw)))
                  data=raw
                  download_source=candidate
                  print('Fuente de descarga validada:',candidate,flush=True)
                  break
              except Exception as err:
                  print('Origen no disponible:',candidate,str(err)[:180],flush=True)
          if data is None:
              raise RuntimeError('No se pudo descargar reproducción completa desde origen ni espejo de descarga')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(data)
          sha=hashlib.sha256(data).hexdigest()
          print('Imagen local validada:',str(dest),'bytes',len(data),'sha256',sha)
          path=pathlib.Path('data/iconografia-vitruviana.json')
          catalog=json.loads(path.read_text(encoding='utf-8'))
          rec=next(x for x in catalog['primaryRecords'] if x['id']=='bernardi-raggio-vitruvio-pollione')
          assert rec['sourceImage']==url
          rec['image']=str(dest)
          rec['fullResolutionImage']=url
          rec['imageVerifiedLocally']=True
          rec['imageSHA256']=sha
          rec['imagePixelSize']='2446 × 3668 px (archivo completo en Commons)' if download_source==url else 'Resolución de copia institucional pendiente de verificación; archivo completo de Commons enlazado como fuente' 
          rec['imageDownloadSource']=download_source
          path.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Publicar original completo y actualizar atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/grabados/vitruvio-pollione-bernardi-raggio.jpg data/iconografia-vitruviana.json
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -m "Preserve full Bernardi–Raggio Vitruvio portrait locally with verified hash"
            git push
          fi
