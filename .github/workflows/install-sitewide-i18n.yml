name: Install sitewide interface language controls
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install-sitewide-i18n.py'
      - 'scripts/test-sitewide-i18n.py'
      - '.github/workflows/install-sitewide-i18n.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: install-sitewide-language
  cancel-in-progress: false
jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test installer and source preservation
        run: python -m unittest discover -s scripts -p 'test-sitewide-i18n.py'
      - name: Install loader and audit every HTML file
        run: python scripts/install-sitewide-i18n.py
      - name: Publish coverage report
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads(Path('data/audits/sitewide-i18n-linkage.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Vitruvius · cobertura del cargador de idiomas\\n')
              f.write(f'HTML inspeccionados: **{j["htmlFiles"]}**\\n\\n')
              for label,count in j['statuses'].items():
                  f.write(f'- {label}: {count}\\n')
              f.write('\\n**Importante:** cobertura de instalación no significa que todos los párrafos estén traducidos; eso exige traducciones revisadas o servicio compatible.\\n')
          PY
      - name: Commit coverage across the HTML corpus
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' data/audits/sitewide-i18n-linkage.json
          if git diff --cached --quiet; then
            echo "No HTML files need changing"
          else
            git commit -m "fix(i18n): instalar selector global en páginas HTML y registrar cobertura"
            git push
          fi
