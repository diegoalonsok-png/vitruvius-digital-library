name: Auditoría automatizada de la biblioteca
on:
  push:
    paths:
      - 'assets/**'
      - '**/*.html'
      - 'scripts/audit-site-links.mjs'
      - 'assets/search-core.mjs'
      - 'concordancia-historica.html'
      - 'data/text/**'
      - 'data/structured/**'
      - 'scripts/test-search.mjs'
      - 'scripts/test-historical.mjs'
      - '.github/workflows/site-audit.yml'
      - 'scripts/browser-smoke-audit.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validación de sintaxis
        run: |
          node --check assets/historical-search.mjs
          node --check assets/critical-search.mjs
          node --check assets/historical-pdf-overlay.mjs
          node --check assets/latin-suggest.js
          node --check assets/perrault-iiif.mjs
          node --check assets/scriptorium.mjs
          node --check assets/harley-reader.mjs
          node --check assets/app.js
          node --check assets/bibliography.js
          node --check assets/studies.js
          node --check scripts/browser-smoke-audit.mjs
      - name: Auditoría de enlaces internos y controles HTML
        run: node scripts/audit-site-links.mjs
      - name: Integridad de buscador Vitruvio
        run: node scripts/test-search.mjs
      - name: Ediciones históricas y OCR
        run: node scripts/test-historical.mjs
      - name: Preparar navegador de prueba
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Auditoría real de interfaz, botones y PDF locales
        run: node scripts/browser-smoke-audit.mjs
