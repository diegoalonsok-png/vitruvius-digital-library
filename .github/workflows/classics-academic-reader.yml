name: Lectura clásica, notas y digitalización de PDF
on:
  pull_request:
    paths: ['assets/classics-*.js', 'assets/classics-*.css', 'assets/ui-idioma.js', 'classics-text-reader.html', 'buscador-facsimiles-clasicos.html', 'scripts/*classics*', 'scripts/classics_ingestion_bundle.py', 'data/classics-corpus/reading-notes/**', 'data/classics-historical-pages/**', 'data/index/classics-pdf/**', '.github/workflows/classics-academic-reader.yml']
  push:
    branches: [main]
    paths: ['assets/classics-*.js', 'assets/classics-*.css', 'assets/ui-idioma.js', 'classics-text-reader.html', 'buscador-facsimiles-clasicos.html', 'scripts/*classics*', 'scripts/classics_ingestion_bundle.py', 'data/classics-corpus/reading-notes/**', 'data/classics-historical-pages/**', 'data/index/classics-pdf/**', '.github/workflows/classics-academic-reader.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: classics-academic-reader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: python -m pip install --disable-pip-version-check pymupdf
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Lectores, notas de las fuentes, búsquedas, loci y PDF enfrentados
        run: |
          node scripts/test-classics-source-note-navigator.mjs
          node scripts/test-classics-academic-reader.mjs
          node scripts/test-facsimile-facing-reader.mjs
          node scripts/test-classics-reader-search.mjs
          node scripts/test-classics-source-diagnostics.mjs
          node scripts/test-visor-facsimiles-r2.mjs
      - name: OCR real de un PDF sin capa de texto e índices de lectura
        run: python scripts/test-classics-ingestion-bundle.py
