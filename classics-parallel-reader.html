<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex,follow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirección al visor académico · Vitruvius</title>
<script>
(function(){
 "use strict";
 const p=new URLSearchParams(location.search);
 const u=new URL("classics-text-reader.html",location.href);
 for(const key of ["work","locus","q"]){
  if(p.has(key))u.searchParams.set(key,p.get(key));
 }
 const left=p.get("left");
 if(left&&/^(la|grc|es|en|fr|it|de|pt)$/.test(left))u.searchParams.set("lang",left);
 const target=(p.get("right")||"").replace(/^auto-/,"");
 if(/^(es|en|fr)$/.test(target))u.searchParams.set("to",target);
 location.replace(u.href);
})();
</script>
</head><body>
<p>El visor anterior fue retirado. <a href="classics-text-reader.html">Abrir el visor académico vigente</a>.</p>
</body></html>
