<!doctype html>
<html lang="es" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visor simple · Bibliotheca Graeca et Latina</title><meta name="description" content="Lectura sencilla de textos clásicos originales y sus traducciones indexadas y traducción automática opcional, por locus.">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#050505;color:#f0f0f1;font-family:system-ui,-apple-system,sans-serif}main{max-width:1720px;margin:0 auto;padding:30px clamp(14px,4vw,64px)}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 0 30px}.top h1{font-size:clamp(20px,2.1vw,32px);font-weight:400;line-height:1.35;color:#dedee0;margin:0}.actions{display:flex;align-items:center;gap:12px}.actions a,.actions button{font:14px system-ui;color:#ececef;background:#151515;border:1px solid #4b4b4b;padding:9px 12px;text-decoration:none;border-radius:9px;cursor:pointer}.actions button{font-size:22px;min-width:42px}.actions button:disabled{opacity:.4;cursor:default}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{background:#303030;border-radius:17px;padding:clamp(20px,2vw,38px);min-width:0;min-height:65vh}.card h2{font:400 clamp(16px,1.6vw,23px)/1.4 system-ui;color:#cecece;margin:0 0 28px}.passage{font:clamp(21px,2.4vw,35px)/1.8 Georgia,"Times New Roman",serif;white-space:pre-wrap;overflow-wrap:anywhere}.passage p{margin:0 0 1.25em}.empty{font:17px/1.65 system-ui;color:#ddd}.note{color:#aaa;font:12px/1.6 system-ui;margin-top:14px}.note a{color:#ddd}button:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:3px}@media(max-width:750px){.cards{grid-template-columns:1fr;gap:14px}.card{min-height:38vh}.top{align-items:flex-start;flex-direction:column}.actions{flex-wrap:wrap}.passage{font-size:24px}}@media print{.actions{display:none}main{padding:0}.card{min-height:0;break-inside:avoid}}

/* Herramientas mínimas de lectura, sin alterar ni fabricar traducciones. */
.translate-action{margin-top:20px;background:#464646;color:#fff;border:1px solid #777;border-radius:9px;padding:10px 14px;cursor:pointer;font:13px system-ui}.translate-action[hidden]{display:none}.translate-action:disabled{opacity:.6;cursor:wait}
.toolbar{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap;margin:-14px 0 19px}
.toolbar input,.toolbar select,.toolbar button{font:13px system-ui;background:#181819;color:#eee;border:1px solid #48484b;border-radius:7px;padding:8px 10px;min-height:36px}
.toolbar input{width:135px;max-width:32vw}.toolbar #original-lang,.toolbar #translation-lang{max-width:170px}.toolbar #go-button{border:1px solid #a0a0a4;background:#38383b;color:#fff;font-weight:600}.toolbar button{cursor:pointer}.toolbar button:hover{background:#303033}
.toolbar label{font:12px system-ui;color:#c4c4c5;display:flex;align-items:center;gap:5px}
.toolbar button:focus-visible,.toolbar input:focus-visible,.toolbar select:focus-visible{outline:2px solid #fff;outline-offset:2px}
.cards{--card-bg:#303030;--text-color:#f2f2f3;--body-font:Georgia,serif;--body-size:30px}.card{background:var(--card-bg);color:var(--text-color)}
.card h2{color:var(--text-color);opacity:.82}.passage{font-family:var(--body-font);font-size:var(--body-size)}
mark.simple-match{background:#d8a442;color:#161616;border-radius:2px}
@media(max-width:750px){.toolbar{justify-content:flex-start;margin-top:0}.toolbar input{width:125px;max-width:45vw}}
@media print{.toolbar{display:none}}

.panel-colors{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:0 0 22px;font:12px system-ui;color:inherit}
.panel-colors .group-label{opacity:.76}.panel-colors .separator{height:16px;border-left:1px solid #888;margin:0 6px}
.panel-colors button{width:24px;height:24px;border-radius:50%;background:var(--sample);border:2px solid #888;cursor:pointer;padding:0}
.panel-colors button:hover{transform:scale(1.08)}.panel-colors button[aria-pressed="true"]{outline:2px solid #eee;outline-offset:2px}
.panel-colors button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.panel-colors .color-custom{width:28px;height:28px;border:1px solid #aaa;border-radius:50%;padding:2px;background:#282828;cursor:pointer}
.panel-colors .color-custom::-webkit-color-swatch-wrapper{padding:0}
.panel-colors .color-custom::-webkit-color-swatch{border:0;border-radius:50%}
.panel-colors .color-custom::-moz-color-swatch{border:0;border-radius:50%}
.card mark.user-highlight{color:#181818;border-radius:3px;padding:0 2px}
@media print{.panel-colors{display:none}}
</style></head><body><main>
<div class="top"><h1 id="title">BIBLIOTHECA · LECTURA SIMPLE</h1><nav class="actions" aria-label="Navegación de lectura"><a id="academic" href="classics-parallel-reader.html">Visor académico</a><button id="previous" type="button" aria-label="Pasaje anterior">‹</button><button id="next" type="button" aria-label="Pasaje siguiente">›</button></nav></div>
<div class="toolbar" role="group" aria-label="Herramientas de lectura"><label>Original <select id="original-lang" aria-label="Idioma original"></select></label><label>Traducción <select id="translation-lang" aria-label="Idioma de la traducción"></select></label><label>Locus <input id="go-locus" type="search" placeholder="Ej. 2" aria-label="Locus o capítulo"></label><button id="go-button" type="button">Ir al locus</button><a id="lexicon-link" href="vitruvia-lexicon.html" style="border:1px solid #555;border-radius:7px;padding:8px 10px;color:#eee;text-decoration:none;font:13px system-ui">Diccionario · Lexicon</a><label>Palabra <input id="word-query" type="search" placeholder="Buscar palabra" aria-label="Buscar palabra"></label><button id="word-find" type="button" aria-label="Buscar próxima coincidencia">⌕</button><label>Letra <select id="font" aria-label="Tipografía"><option value="georgia">Clásica</option><option value="palatino">Palatino</option><option value="sans">Sans</option></select></label><button id="smaller" type="button" aria-label="Reducir texto">A−</button><button id="larger" type="button" aria-label="Ampliar texto">A+</button><label>Color <select id="palette" aria-label="Colores"><option value="dark">Gris</option><option value="sepia">Sepia</option><option value="light">Marfil</option></select></label></div>
<div class="cards"><section class="card"><h2 id="left-head">TEXTO ORIGINAL</h2><div class="panel-colors" id="left-colors" aria-label="Fondo y resaltado del original"></div><div class="passage" id="left-text" aria-live="polite">Cargando texto…</div></section><section class="card"><h2 id="right-head">TRADUCCIÓN</h2><div class="panel-colors" id="right-colors" aria-label="Fondo y resaltado de traducción"></div><div class="passage" id="right-text" aria-live="polite">Cargando traducción…</div><button class="translate-action" id="translate" type="button" hidden>Traducir automáticamente este pasaje</button></section></div>
<p class="note" id="note" role="status">Se utilizan las ediciones existentes en la Bibliotheca. Un locus compartido no demuestra identidad textual de las versiones.</p>
</main><script defer src="assets/academic-inline-translation.js?v=20261109-v1"></script><script>
(()=>{"use strict";
const q=new URLSearchParams(location.search),work=q.get("work")||"didache";
const LANG={grc:"GRIEGO",la:"LATÍN",es:"CASTELLANO",en:"INGLÉS",fr:"FRANCÉS",it:"ITALIANO",de:"ALEMÁN",pt:"PORTUGUÉS"};
const el=id=>document.getElementById(id);let source=[],translation=[],pos=0,leftLang="",rightLang="",title=work;let searchTerm="",targetLang="en",renderToken=0;let availableEditions=new Map(),loadingVersion=0;
const key=v=>String(v??"").trim().toLowerCase().replace(/\s+/g,"");
const status=msg=>el("note").textContent=msg;
const highlightSets={left:new Map(),right:new Map()},visibleText={left:"",right:""};
function currentHighlightKey(side){return work+"|"+side+"|"+(source[pos]?.locus||"");}
function paragraph(id,value){
 const side=id==="left-text"?"left":"right",target=el(id),data=value||"Pasaje sin texto disponible.";
 visibleText[side]=data;target.replaceChildren();const p=document.createElement("p");
 const highlights=highlightSets[side].get(currentHighlightKey(side))||[];
 const choices=[...highlights.map(x=>({...x,custom:true})),...(searchTerm?[{phrase:searchTerm,color:"#d8a442",custom:false}]:[])];
 const lower=data.toLocaleLowerCase();let cursor=0;
 while(cursor<data.length){
  let chosen=null;
  for(const item of choices){if(!item.phrase)continue;const index=lower.indexOf(item.phrase.toLocaleLowerCase(),cursor);
   if(index>=0&&(!chosen||index<chosen.index||(index===chosen.index&&item.custom)))chosen={index,item};
  }
  if(!chosen){p.append(document.createTextNode(data.slice(cursor)));break;}
  if(chosen.index>cursor)p.append(document.createTextNode(data.slice(cursor,chosen.index)));
  const mark=document.createElement("mark");mark.className=chosen.item.custom?"user-highlight":"simple-match";
  if(chosen.item.custom)mark.style.backgroundColor=chosen.item.color;
  mark.textContent=data.slice(chosen.index,chosen.index+chosen.item.phrase.length);p.append(mark);
  cursor=chosen.index+chosen.item.phrase.length;
 }
 target.append(p);
}
const colors=[["Gris","#303030","#f2f2f3"],["Negro","#151515","#f2f2f3"],["Sepia","#493e34","#fff0d7"],["Marfil","#f1e9db","#252525"],["Azul","#293d50","#f5f5f5"]];
const inkColors=[["Blanco","#f2f2f3"],["Marfil","#fff0d7"],["Negro","#252525"],["Azul claro","#b9e0ff"],["Amarillo","#ffe5a0"]];
const highlighters=[["Amarillo","#ffdf65"],["Verde","#a5e5aa"],["Celeste","#97d9ef"],["Rosa","#efa8ca"]];
for(const side of ["left","right"]){
 const toolbar=el(side+"-colors"),card=el(side+"-text").closest(".card");
 let inkCustomized=false;
 const addPicker=(type,initial)=>{
  const picker=document.createElement("input");picker.type="color";picker.className="color-custom";
  picker.value=initial;picker.title="Elegir color personalizado de "+(type==="background"?"fondo":"tipografía");
  picker.setAttribute("aria-label",picker.title);
  picker.addEventListener("input",()=>{
   if(type==="background")card.style.setProperty("--card-bg",picker.value);
   else{inkCustomized=true;card.style.setProperty("--text-color",picker.value);}
   for(const x of toolbar.querySelectorAll('button[data-'+type+']'))x.setAttribute("aria-pressed","false");
  });
  toolbar.append(picker);return picker;
 };

 function label(value){const span=document.createElement("span");span.className="group-label";span.textContent=value;toolbar.append(span);}
 label("Fondo");
 for(const [name,bg,fg] of colors){
  const button=document.createElement("button");button.type="button";button.style.setProperty("--sample",bg);
  button.title="Fondo "+name;button.setAttribute("aria-label","Fondo "+name+" del "+side);
  button.setAttribute("aria-pressed",String(bg==="#303030"));toolbar.append(button);
  button.addEventListener("click",()=>{
   card.style.setProperty("--card-bg",bg);
   if(!inkCustomized)card.style.setProperty("--text-color",fg);
   for(const x of toolbar.querySelectorAll('button[data-background]'))x.setAttribute("aria-pressed",String(x.dataset.background===bg));
  });button.dataset.background=bg;
 }
 addPicker("background","#303030");
 const inkSep=document.createElement("span");inkSep.className="separator";toolbar.append(inkSep);label("Letra");
 for(const [name,color] of inkColors){
  const button=document.createElement("button");button.type="button";button.style.setProperty("--sample",color);
  button.dataset.foreground=color;button.title="Color de tipografía: "+name;
  button.setAttribute("aria-label",button.title);
  button.setAttribute("aria-pressed",String(color==="#f2f2f3"));
  button.addEventListener("click",()=>{
   inkCustomized=true;card.style.setProperty("--text-color",color);
   for(const x of toolbar.querySelectorAll('button[data-foreground]'))x.setAttribute("aria-pressed",String(x.dataset.foreground===color));
  });
  toolbar.append(button);
 }
 addPicker("foreground","#f2f2f3");
 const sep=document.createElement("span");sep.className="separator";toolbar.append(sep);label("Resaltar");
 for(const [name,color] of highlighters){
  const button=document.createElement("button");button.type="button";button.style.setProperty("--sample",color);
  button.title="Seleccioná texto y resaltá en "+name;button.setAttribute("aria-label","Resaltar texto seleccionado en "+name);
  button.addEventListener("click",()=>{
   const selection=window.getSelection(),phrase=selection?.toString().trim()||"";
   const area=el(side+"-text");
   if(!phrase||phrase.length>400||!area.contains(selection.anchorNode)||!area.contains(selection.focusNode)){
    status("Primero seleccioná una palabra o frase del "+(side==="left"?"original":"texto traducido")+" y luego elegí el círculo de resaltado.");return;
   }
   if(!visibleText[side].includes(phrase)){status("La selección no corresponde al pasaje visible.");return;}
   const key=currentHighlightKey(side),list=highlightSets[side].get(key)||[];
   const found=list.find(x=>x.phrase===phrase);
   if(found)found.color=color;else list.push({phrase,color});
   highlightSets[side].set(key,list);paragraph(side+"-text",visibleText[side]);selection.removeAllRanges();
   status("Resaltado local aplicado; no se modificó la edición original.");
  });toolbar.append(button);
 }
}
function linkBack(){const u=new URL("classics-parallel-reader.html",location.href);u.searchParams.set("work",work);u.searchParams.set("left",leftLang||"grc");u.searchParams.set("right",q.get("right")||rightLang||"auto-es");if(source[pos]?.locus)u.searchParams.set("locus",source[pos].locus);el("academic").href=u.href;}
function draw(){
 renderToken++;el("translate").hidden=true;
 const a=source[pos],locus=a?.locus||"";el("title").textContent=title.toUpperCase()+" · "+locus;
 el("left-head").textContent=(LANG[leftLang]||leftLang.toUpperCase())+" · "+locus;
 paragraph("left-text",a?.text);
 const exact=translation.find(p=>key(p.locus)===key(locus));
 el("right-head").textContent=(LANG[rightLang]||"TRADUCCIÓN")+" · "+(exact?.locus||locus);
 if(exact)paragraph("right-text",exact.text);
 else {
  paragraph("right-text","No hay traducción indexada verificable para este locus.");
  el("right-head").textContent="TRADUCCIÓN AUTOMÁTICA · "+(LANG[targetLang]||targetLang.toUpperCase());
  el("translate").hidden=false;
 }
 el("previous").disabled=pos<=0;el("next").disabled=pos>=source.length-1;
 if(a?.locus){q.set("locus",a.locus);el("go-locus").value=a.locus;history.replaceState(null,"",location.pathname+"?"+q.toString());}
 linkBack();
 status(exact?"Texto original y traducción alojada. La coincidencia de locus no acredita por sí sola equivalencia filológica.":"No se inventan traducciones ni se presentan pasajes diferentes como equivalentes.");
}
async function getEdition(entry,lang){
 if(!entry||!/^data\/(?:classics-corpus|structured|lexicon\/fontes)\/[a-z0-9/_-]+\.json$/.test(entry.path||""))return [];
 const r=await fetch(entry.path);if(!r.ok)throw Error("No se pudo abrir la edición "+lang);
 const data=await r.json();if(!Array.isArray(data.passages))return [];
 if(entry.format==="structured-bilingual")return data.passages.map(p=>({locus:String(p.locus||""),text:lang==="la"?p.latin:p.translation})).filter(p=>p.locus&&typeof p.text==="string"&&p.text.trim());
 if(data.workId!==(entry.sourceWorkId||work)||data.language!==lang)return [];
 return data.passages.filter(p=>p.locus&&typeof p.text==="string"&&p.text.trim());
}
async function load(){
 if(!/^[a-z0-9-]{3,60}$/.test(work))throw Error("Identificador de obra inválido.");
 const [cat,reg]=await Promise.all([
  fetch("data/bibliotheca-graeca-latina-I-bce-I-ce.json").then(r=>r.json()),
  fetch("data/classics-corpus/search-registry.json").then(r=>r.json())
 ]);
 const item=(cat.works||[]).find(w=>w.id===work);
 title=(item?.author?item.author+" · ":"")+(item?.title||work);
 const entries=new Map();
 for(const e of reg.entries||[]){
  if(e.workId!==work||!["json-passages","structured-bilingual"].includes(e.format)||!LANG[e.language])continue;
  if(!entries.has(e.language)||e.format==="json-passages")entries.set(e.language,e);
 }
 availableEditions=entries;
 const fillSelect=(id,options)=>{const sel=el(id);sel.replaceChildren();for(const [value,label] of options){const opt=document.createElement("option");opt.value=value;opt.textContent=label;sel.append(opt);}};
 fillSelect("original-lang",["grc","la"].filter(l=>entries.has(l)).map(l=>[l,LANG[l]]));
 if(!el("original-lang").options.length)fillSelect("original-lang",[...entries.keys()].map(l=>[l,LANG[l]]));
 fillSelect("translation-lang",[
 ...["es","en","fr","it","de","pt"].filter(l=>entries.has(l)).map(l=>[l,LANG[l]+" · edición alojada"]),
 ...["es","en","fr"].map(l=>["auto-"+l,LANG[l]+" · automática"])
 ]);
 leftLang=entries.has(q.get("left"))?q.get("left"):(entries.has(q.get("lang"))?q.get("lang"):(["grc","la"].find(l=>entries.has(l))||[...entries.keys()][0]));
 if(!leftLang)throw Error("La obra no dispone de edición textual estructurada para este lector.");
 const requested=q.get("right");
 targetLang=(requested||"").replace(/^auto-/,"");if(!["es","en","fr"].includes(targetLang))targetLang="en";
 rightLang=entries.has(requested)&&requested!==leftLang?requested:
  (["es","en","fr","it","de","pt"].find(l=>l!==leftLang&&entries.has(l))||[...entries.keys()].find(l=>l!==leftLang)||"");
 el("original-lang").value=leftLang;
 source=await getEdition(entries.get(leftLang),leftLang);
 if(!source.length)throw Error("No hay pasajes de la edición original.");
 translation=rightLang?await getEdition(entries.get(rightLang),rightLang):[];
 if(requested?.startsWith("auto-")){translation=[];rightLang=targetLang;}
 el("translation-lang").value=requested?.startsWith("auto-")?requested:(requested&&entries.has(requested)?requested:(rightLang&&entries.has(rightLang)?rightLang:"auto-es"));
 if(!el("translation-lang").value)el("translation-lang").value="auto-es";

 const wanted=q.get("locus");const found=source.findIndex(p=>key(p.locus)===key(wanted));pos=found<0?0:found;draw();
}
async function changeVersion(side,value){
 const stamp=++loadingVersion,previousLocus=source[pos]?.locus||q.get("locus")||"";
 if(side==="left"){
  if(!availableEditions.has(value))return;
  const updated=await getEdition(availableEditions.get(value),value);
  if(stamp!==loadingVersion)return;
  if(!updated.length){status("La edición original seleccionada no tiene pasajes legibles.");return;}
  source=updated;leftLang=value;q.set("left",value);
  if(el("translation-lang").value===value){el("translation-lang").value="auto-es";}
 }else if(!value.startsWith("auto-")&&!availableEditions.has(value))return;
 const choice=el("translation-lang").value;
 if(choice.startsWith("auto-")){
  targetLang=choice.slice(5);rightLang=targetLang;translation=[];q.set("right",choice);
 }else{
  const updated=await getEdition(availableEditions.get(choice),choice);
  if(stamp!==loadingVersion)return;
  translation=updated;rightLang=choice;targetLang=["es","en","fr"].includes(choice)?choice:"es";q.set("right",choice);
 }
 const found=source.findIndex(p=>key(p.locus)===key(previousLocus));
 pos=found>=0?found:0;draw();
}
el("original-lang").addEventListener("change",e=>{void changeVersion("left",e.target.value);});
el("translation-lang").addEventListener("change",e=>{void changeVersion("right",e.target.value);});
el("translate").addEventListener("click",async()=>{
 const button=el("translate"),record=source[pos],token=renderToken;
 if(!record?.text||!window.VitruviaInlineTranslation?.translate){status("El servicio de traducción automática no está disponible.");return;}
 button.disabled=true;button.textContent="Traduciendo…";
 paragraph("right-text","Procesando traducción orientativa…");
 try{
  const result=await window.VitruviaInlineTranslation.translate(record.text,leftLang,targetLang);
  if(token!==renderToken)return;
  paragraph("right-text",result.text);button.hidden=true;
  status("Traducción automática orientativa · "+result.provider+(result.partial?" · Traducción parcial.":"")+(leftLang==="grc"?" · El servicio interpreta griego antiguo como moderno: requiere revisión filológica.":"")+" No equivale a una traducción académica verificada.");
 }catch(e){if(token===renderToken){paragraph("right-text","No se pudo obtener la traducción automática de este pasaje.");status("El proveedor de traducción no respondió. El original permanece disponible.");}}
 finally{button.disabled=false;button.textContent="Traducir automáticamente este pasaje";}
});
const cards=document.querySelector(".cards");let fontSize=30;const FONTS={georgia:'Georgia, "Times New Roman", serif',palatino:'Palatino, "Book Antiqua", serif',sans:'system-ui, sans-serif'};
function appearance(){cards.style.setProperty("--body-size",fontSize+"px");cards.style.setProperty("--body-font",FONTS[el("font").value]||FONTS.georgia);const palettes={dark:["#303030","#f2f2f3"],sepia:["#493e34","#fff0d7"],light:["#f1e9db","#252525"]};const pair=palettes[el("palette").value]||palettes.dark;cards.style.setProperty("--card-bg",pair[0]);cards.style.setProperty("--text-color",pair[1]);}
el("smaller").onclick=()=>{fontSize=Math.max(17,fontSize-2);appearance();};el("larger").onclick=()=>{fontSize=Math.min(44,fontSize+2);appearance();};el("font").onchange=appearance;el("palette").onchange=appearance;
el("go-button").onclick=()=>{const wanted=key(el("go-locus").value);const i=source.findIndex(p=>key(p.locus)===wanted);if(i<0){status("No se encontró ese locus en esta edición.");return;}pos=i;draw();};el("go-locus").addEventListener("keydown",e=>{if(e.key==="Enter")el("go-button").click();});
const lexiconLink=el("lexicon-link");document.addEventListener("selectionchange",()=>{
 const selection=window.getSelection(),word=selection?.toString().trim()||"";
 if(!word||word.length>80||/\\s/.test(word))return;
 const node=selection.anchorNode;
 if(!node||!el("left-text").contains(node)&&!el("right-text").contains(node))return;
 const u=new URL("vitruvia-lexicon.html",location.href);u.searchParams.set("q",word);u.searchParams.set("mode","palabra");lexiconLink.href=u.href;
});
el("word-find").onclick=()=>{searchTerm=el("word-query").value.trim().slice(0,80);if(!searchTerm){draw();return;}const low=searchTerm.toLocaleLowerCase();const matches=record=>String(record?.text||"").toLocaleLowerCase().includes(low);let next=-1;for(let n=0;n<source.length;n++){const idx=(pos+n)%source.length;if(matches(source[idx])||matches(translation.find(p=>key(p.locus)===key(source[idx].locus)))){next=idx;break;}}if(next<0){status("No se encontró esa palabra en los pasajes con locus correspondiente.");return;}pos=next;draw();};el("word-query").addEventListener("keydown",e=>{if(e.key==="Enter")el("word-find").click();});appearance();
el("previous").onclick=()=>{if(pos>0){pos--;draw();}};
el("next").onclick=()=>{if(pos<source.length-1){pos++;draw();}};
load().catch(e=>{paragraph("left-text",e.message);paragraph("right-text","Volvé al visor académico para consultar las ediciones disponibles.");status("No se modificó ningún texto del catálogo.");linkBack();});
})();
</script></body></html>
