<main>
 <section class="intro"><h1>¿Qué querés investigar?</h1></section>
 <section id="conversation" class="out" aria-live="polite" aria-label="Conversación y resultados"></section>
 <div class="surface" role="group" aria-label="Nueva consulta">
  <label class="assistive" for="question">Escribir consulta</label>
  <textarea id="question" rows="1" placeholder="Preguntá, investigá, analizá un documento…" aria-label="Consulta" spellcheck="true"></textarea>
  <div class="file-line" id="file-info" aria-live="polite"></div>
  <div class="toolbar">
   <label class="attachment" for="file" role="button" tabindex="0" title="Adjuntar PDF, DOCX o TXT" aria-label="Adjuntar PDF o documento">+</label>
   <input id="file" type="file" accept=".pdf,.docx,.txt,.xml,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" aria-label="Seleccionar PDF o documento">
   <button id="clear" class="clear" type="button" title="Borrar sesión" aria-label="Borrar sesión">↺</button>
   <button id="send" class="send" type="button" aria-label="Enviar consulta" title="Enviar consulta">↑</button>
  </div>
 </div>
</main>
<script type="module">
const q=document.getElementById('question'),fileInput=document.getElementById('file'),info=document.getElementById('file-info'),output=document.getElementById('conversation');
let documentData=null,session=0,pdfLibrary=null,zipLoader=null;

// Palette copied from Lexicon's background-control interaction: 3x3 swatches,
// plus an explicit light/dark control. Preferences stay in this tab only.
const root=document.documentElement;
const palette=document.getElementById('ia-palette');
function setAppearance(color){
 const hex=String(color||'').toLowerCase();
 if(!/^#[0-9a-f]{6}$/.test(hex))return;
 const channels=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255);
 const brightness=.2126*channels[0]+.7152*channels[1]+.0722*channels[2];
 root.dataset.theme=brightness>.62?'light':'dark';
 root.style.setProperty('--ia-paper',hex);
 document.querySelectorAll('.ia-swatch').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color===hex)));
 document.getElementById('ia-custom-color').value=hex;
 document.getElementById('ia-theme').textContent=brightness>.62?'☀':'☾';
}
document.querySelectorAll('.ia-swatch').forEach(b=>b.addEventListener('click',()=>{setAppearance(b.dataset.color);palette.open=false}));
document.getElementById('ia-custom-color').addEventListener('input',e=>setAppearance(e.target.value));
document.getElementById('ia-theme').addEventListener('click',()=>setAppearance(root.dataset.theme==='light'?'#0d0e10':'#f7f5ef'));
setAppearance('#0d0e10');

const el=(tag,text,klass)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(klass)n.className=klass;return n};
const fold=s=>String(s||'').normalize('NFD').replace(/\p{M}/gu,'').toLocaleLowerCase().replace(/ς/g,'σ').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const tokens=s=>fold(s).split(/\s+/).filter(x=>x.length>=3);
const frequent=s=>{const stop=new Set('que para como una unos unas por los las del con este esta ese esa son fue the and for was were from into about quod quae atque enim etiam sed cum est sunt per qui qua non eius illius hoc haec hunc quod deum deos τους και του την των μεν δε γαρ προς οτι'.split(' '));const scores=new Map();for(const x of tokens(s))if(!stop.has(x))scores.set(x,(scores.get(x)||0)+1);return [...scores].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,18)};
const describeScript=text=>{const greek=[...text.matchAll(/[\u0370-\u03ff\u1f00-\u1fff]/gu)].length,latin=[...text.matchAll(/[A-Za-zÀ-ÿ]/g)].length,egypt=[...text.matchAll(/[\u{13000}-\u{1345F}]/gu)].length;return egypt>=3?'jeroglíficos egipcios':greek>latin*.15?'griego':'latín o lengua de alfabeto latino'};
const shorten=(s,n=600)=>String(s||'').replace(/\s+/g,' ').slice(0,n);
function addText(parent,tag,value,klass){const n=el(tag,value,klass);parent.append(n);return n}
function link(parent,url,label){const a=el('a',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';parent.append(a);return a}
function chicagoWebCitation(title,url){
 const access=new Intl.DateTimeFormat('es-AR',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date());
 return 'Wikipedia contributors. “'+title+'.” Wikipedia. Consultado el '+access+'. '+url+'.';
}
function entry(title){const n=el('article',null,'entry');output.prepend(n);addText(n,'h2',title);return n}
function clear(){++session;documentData=null;pdfLibrary=null;zipLoader=null;fileInput.value='';info.textContent='';info.classList.remove('on');output.replaceChildren();q.value='';q.focus()}
document.getElementById('clear').addEventListener('click',clear);
document.querySelector('.attachment').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileInput.click()}});
async function pdfText(file,token){
 if(!pdfLibrary)pdfLibrary=import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
 const pdfjs=await pdfLibrary;pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
 const bytes=new Uint8Array(await file.arrayBuffer());const task=pdfjs.getDocument({data:bytes,isEvalSupported:false});
 try{
  const pdf=await task.promise,pages=[],limit=Math.min(pdf.numPages,150);let remaining=350000,empty=0;
  for(let i=1;i<=limit&&remaining>0;i++){
   if(token!==session)throw Error('Lectura cancelada');
   const page=await pdf.getPage(i),tc=await page.getTextContent(),text=(tc.items||[]).map(x=>x.str||'').join(' ').slice(0,remaining);
   if(text.trim())pages.push({label:'Página '+i,text});else empty++;remaining-=text.length;
   page.cleanup();
  }
  if(!pages.length)throw Error('El PDF no contiene una capa de texto extraíble. Necesita OCR; no se inventará una transcripción.');
  return {pages,partial:limit<pdf.numPages,notes:empty+' páginas examinadas sin texto. PDF.js no ejecuta OCR.'};
 }finally{try{await task.destroy()}catch{}}
}
async function docxText(file,token){
 if(!zipLoader){zipLoader=new Promise((resolve,reject)=>{if(window.JSZip)return resolve(window.JSZip);const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';script.onload=()=>window.JSZip?resolve(window.JSZip):reject(Error('No se pudo cargar el lector DOCX'));script.onerror=()=>reject(Error('Lector DOCX no disponible'));document.head.append(script)})}
 const JSZip=await zipLoader,zip=await JSZip.loadAsync(await file.arrayBuffer());if(token!==session)throw Error('Lectura cancelada');
 const xml=await zip.file('word/document.xml')?.async('string');if(!xml)throw Error('DOCX inválido o sin documento principal');
 const parser=new DOMParser(),doc=parser.parseFromString(xml,'application/xml');
 if(doc.querySelector('parsererror'))throw Error('XML inválido en el DOCX');
 const ps=[...doc.getElementsByTagNameNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main','p')];
 let left=350000;const pages=[];
 for(let i=0;i<ps.length&&left>0;i++){const parts=ps[i].getElementsByTagNameNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main','t');const value=[...parts].map(x=>x.textContent||'').join('').slice(0,left);if(value.trim()){pages.push({label:'Párrafo '+(i+1),text:value});left-=value.length}}
 if(!pages.length)throw Error('No se extrajo texto del DOCX');
 return {pages,partial:left<=0,notes:'Extracción de párrafos OOXML; no acredita variantes editoriales ni folios manuscritos.'};
}
async function textFile(file){const text=await file.text();if(!text.trim())throw Error('Archivo sin texto');return {pages:text.slice(0,350000).split(/\n\s*\n/).filter(Boolean).map((t,i)=>({label:'Párrafo '+(i+1),text:t})),partial:text.length>350000,notes:'Texto local sin atribución editorial automática.'}}
fileInput.addEventListener('change',async()=>{
 const file=fileInput.files?.[0];if(!file)return;
 const token=++session;documentData=null;info.classList.add('on');info.textContent='Leyendo «'+file.name+'» en esta pestaña…';
 if(file.size>15*1024*1024){info.textContent='El archivo supera el límite de 15 MB.';fileInput.value='';return}
 try{
  let parsed;if(/\.pdf$/i.test(file.name))parsed=await pdfText(file,token);
  else if(/\.docx$/i.test(file.name))parsed=await docxText(file,token);
  else if(/\.(txt|xml)$/i.test(file.name))parsed=await textFile(file);
  else throw Error('Solo se admiten PDF, DOCX, TXT o XML.');
  if(token!==session)return;
  documentData={name:file.name,...parsed};
  const size=parsed.pages.reduce((n,p)=>n+p.text.length,0);
  info.textContent='✓ '+file.name+' · '+parsed.pages.length+' unidades de texto · '+size.toLocaleString('es-AR')+' caracteres'+(parsed.partial?' · extracción parcial':'')+'. Puedes preguntar por el documento.';
  fileInput.value='';
  const box=entry('Documento cargado de manera privada');addText(box,'p','Texto disponible solo en esta pestaña. '+parsed.notes);addText(box,'p','No se enviará el documento a GitHub ni al buscador web. Cierra o borra la sesión para descartarlo.', 'caption');
 }catch(error){if(token===session){info.textContent='No se pudo leer: '+error.message;fileInput.value=''}}
});
function searchDocument(question,box){
 const data=documentData;const full=data.pages.map(p=>p.text).join('\n');
 const allTokens=tokens(full),freq=frequent(full),queryTerms=tokens(question).filter(w=>w.length>=3);
 addText(box,'p','Documento: '+data.name+' · '+data.pages.length+' unidades de lectura · '+allTokens.length.toLocaleString('es-AR')+' tokens aproximados · escritura predominante: '+describeScript(full)+'.');
 if(/frecuen|palabras|vocabulario|estad[ií]stica|lexic|analiz|resumen|síntesis|sintesis|estructura/i.test(question)||!queryTerms.length){
  addText(box,'h3','Distribución léxica descriptiva');
  addText(box,'p',freq.map(([t,n])=>t+' ('+n+')').join(' · '));
  addText(box,'p','La frecuencia no es análisis morfológico ni lematización. En griego y latín las flexiones permanecen separadas.','caption');
 }
 const terms=queryTerms.filter(w=>!new Set(['este','esta','texto','documento','obra','pasaje','sobre','donde','cual','cuáles','cuales','porque','encontrar','buscar','quiero','analizar','resumen','tiene','como','cuando']).has(w));
 const rank=data.pages.map((p,i)=>{const hay=' '+fold(p.text)+' ';const count=terms.reduce((n,t)=>n+hay.split(' '+t+' ').length-1,0);return {...p,index:i,count}}).filter(p=>p.count>0).sort((a,b)=>b.count-a.count).slice(0,16);
 if(rank.length){addText(box,'h3','Pasajes recuperados literalmente');for(const p of rank){addText(box,'small',p.label+' · '+p.count+' coincidencias');addText(box,'div',shorten(p.text,1800),'quote')}}
 else if(terms.length){addText(box,'p','No encontré esas palabras de manera literal en el texto extraído. Prueba otra grafía o una forma flexiva.');}
 else{addText(box,'h3','Fragmentos iniciales');for(const p of data.pages.slice(0,8)){addText(box,'small',p.label);addText(box,'div',shorten(p.text,1300),'quote')}}
 addText(box,'p','La respuesta se basa en texto extraído y coincidencias verificables, no en una interpretación generativa. No se asigna ningún folio o traducción sin cotejo.','caption');
}
async function webResearch(question,box,token){
 addText(box,'p','Consulta pública: '+question+'. Se buscan fichas y descripciones documentadas; los resultados no equivalen a una síntesis crítica automática.');
 const status=addText(box,'p','Buscando referencias web…','pending');
 const query=question.replace(/^(?:busca|buscar|investiga|quien fue|quién fue|que es|qué es|dime|explica)\s+/i,'').slice(0,140);
 const encycl='https://es.wikipedia.org/w/api.php?'+new URLSearchParams({action:'query',list:'search',srsearch:query,srlimit:'15',format:'json',origin:'*'});
 try{
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8500);
  let data;try{const r=await fetch(encycl,{signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json()}finally{clearTimeout(timeout)}
  if(token!==session)return;
  const records=data.query?.search||[];status.textContent=records.length?'Referencias enciclopédicas identificadas (verificar las fuentes originales):':'Sin resultados enciclopédicos directos.';
  for(const rec of records){const block=el('div',null,'source');box.append(block);const title=rec.title||'Ficha';const url='https://es.wikipedia.org/wiki/'+encodeURIComponent(title.replace(/ /g,'_'));const strong=el('strong');block.append(strong);link(strong,url,title);const clean=new DOMParser().parseFromString(rec.snippet||'','text/html').body.textContent||'';addText(block,'p',clean);addText(block,'small','Fuente secundaria · referencia Chicago 18 orientativa:');addText(block,'small',chicagoWebCitation(title,url))}
 }catch{if(token===session)status.textContent='La consulta directa no está disponible. Puedes continuar con los catálogos externos.'}
 const nav=el('p');box.append(nav);
 link(nav,'https://www.google.com/search?'+new URLSearchParams({q:question}),'Google');nav.append(document.createTextNode(' · '));
 link(nav,'https://scholar.google.com/scholar?'+new URLSearchParams({q:question}),'Google Scholar');nav.append(document.createTextNode(' · '));
 link(nav,'https://search.worldcat.org/search?q='+encodeURIComponent(question),'WorldCat');nav.append(document.createTextNode(' · '));
 link(nav,'https://www.perseus.tufts.edu/hopper/searchresults?q='+encodeURIComponent(question),'Perseus');
}
async function optionalLocalAI(question,box){
 const API=window.LanguageModel;
 if(!API?.create){
  addText(box,'p','El modelo generativo local no está disponible en este navegador. Se muestran los pasajes recuperados literalmente, sin simular respuestas de IA.','caption');return;
 }
 const source=(documentData?.pages||[]).slice(0,24).map(x=>x.label+': '+x.text).join('\n').slice(0,10500);
 if(!source.trim())return;
 const status=addText(box,'p','Consultando el modelo de IA local del navegador…','pending');
 let model=null;
 try{
  model=await API.create();
  const answer=await model.prompt('Analiza exclusivamente este texto. No inventes citas, folios ni autorías. Identifica incertidumbres. Responde en español extensamente según la evidencia disponible, sin inventar datos. Explica qué fragmentos sustentan las afirmaciones e incorpora referencias en estilo Chicago 18 solo con metadatos verificables. Consulta: '+question+'\n\nDOCUMENTO LOCAL:\n'+source);
  status.textContent='Interpretación generada por el modelo local del navegador; requiere cotejo filológico.';
  addText(box,'div',String(answer||''),'quote');
 }catch{status.textContent='No pudo iniciarse la IA local; los pasajes extraídos siguen disponibles.'}
 finally{try{model?.destroy?.()}catch{}}
}
async function ask(){const question=q.value.trim();if(!question)return;q.value='';const token=session,box=entry(question);if(/^web\s*:/i.test(question)){await webResearch(question.replace(/^web\s*:/i,''),box,token)}else if(documentData){searchDocument(question,box);if(/^ia\s*:/i.test(question))await optionalLocalAI(question.replace(/^ia\s*:/i,''),box)}else{await webResearch(question,box,token)}}
document.getElementById('send').addEventListener('click',()=>void ask());
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();void ask()}});
window.addEventListener('pagehide',()=>{documentData=null;fileInput.value='';output.replaceChildren()});
</script>
